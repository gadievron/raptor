[pytest]
# Root-level pytest configuration.
#
# Lives here (not in a per-package pyproject.toml) because raptor's CI
# invokes ``pytest core packages`` from the rootdir; pytest reads its
# config from rootdir up. Per-package ``[tool.pytest.ini_options]``
# sections only apply when their package is run standalone.
#
# This file does three things:
#   1. Registers the ``integration`` marker so live-network tests
#      (cve_diff's ``TestOSVLive``, ``TestNVDLive``, etc.) don't
#      emit ``UnknownMarkWarning`` during collection.
#   2. Deselects integration tests by default. Opt in with
#      ``pytest -m integration`` (drops the negation).
#   3. Skips RAPTOR's analysis output trees (``out/``, ``.out/``) and
#      the per-target work areas spawned under ``.claude/worktrees/``
#      so transient PoC ``test_*.py`` files inside scanned repos aren't
#      collected.
#
# Other packages can extend ``markers`` as they grow their own
# conventions. Shared raptor-wide pytest config goes here too.

markers =
    integration: tests that hit live network — deselected by default
    slow: tests kept out of the default tier — genuine multi-second cost (perf baselines, real spawns, whole-tree sweeps) that breaches the tier budget (RAPTOR_MAX_TEST_SECONDS, 10s) under loaded-runner variance even when faster unloaded, OR fast tests whose expected failures are host-state reminders that must redden one nightly lane instead of every session's fast battery (the marked test states which) — opt in with `pytest -m slow`
    corpus: corpus-scale measurement harnesses (clone + build + coverage over real third-party projects, minutes-per-test) — weekly workflow / manual only, opt in with `pytest -m corpus`
    timeout: per-test deadline, enforced by the OPTIONAL pytest-timeout plugin when installed — registered so hosts without the plugin treat the mark as inert instead of emitting PytestUnknownMarkWarning
    ambient_git_config: opt this one test out of the session-wide git hermeticity env pinning (GIT_CONFIG_GLOBAL/GIT_CONFIG_SYSTEM=/dev/null + GIT_* strip) — restores the operator's ambient git env for its duration; needs a written justification, the default protects the operator's real config
    darwin_native: binds to the real Darwin kernel (sandbox-exec / Seatbelt enforcement, darwin sysctls) — on native runs it skips unless the host really is darwin; under RAPTOR_TEST_EMULATE_PLATFORM it is deselected, because emulation must never stack on real kernel behaviour (root conftest enforces both)
    linux_native: binds to the real Linux kernel (namespaces, Landlock, seccomp, /proc, live sandbox spawns) — same handling as darwin_native with the platforms swapped; a test carrying BOTH native markers binds to whichever real kernel it runs on and is likewise deselected under emulation

# --durations=25 prints the 25 slowest tests at the end of every run
# (CI + local) — the standing "what's getting slow" signal. Near-free:
# pytest already times every test; this only prints the tail. (A hung
# test is caught separately by faulthandler_timeout, set CI-only via
# PYTEST_ADDOPTS in tests.yml so local pdb sessions aren't disrupted.)
addopts = -m "not integration and not slow and not corpus" --import-mode=importlib --durations=25

# Ensure each package's source root is importable without requiring an
# editable install. Mirrors pytest's prepend-mode behaviour for the
# subset of packages that have non-test runtime imports
# (``from cve_diff.X import Y`` etc.) referenced from tests.
pythonpath = packages/cve_diff packages/cve_env packages/diagram packages/exploit_feasibility

norecursedirs = out .out .claude .git build dist *.egg .tox .venv venv node_modules fixtures

# Third-party import-time noise ONLY — our own deprecations get FIXED,
# never filtered, and no entry may blanket-ignore a category.
#
#   * typer 0.25.x's own __init__ imports click.utils.get_binary_stream
#     / get_text_stream, which click 8.5.0 deprecates ahead of the
#     Click 9.0 removal (click is unpinned, so CI gets 8.5+ regardless
#     of the local install). Pure upstream churn (typer re-exports them for
#     compatibility); scoped to the exact messages and the typer module
#     so anything OUR code does with those helpers still warns. Remove
#     both entries when the pinned typer ships a click-9-compatible
#     release (requirements.txt pin bump past 0.25.x is the trigger to
#     re-check).
filterwarnings =
    ignore:'click\.utils\.get_binary_stream' is deprecated:DeprecationWarning:typer
    ignore:'click\.utils\.get_text_stream' is deprecated:DeprecationWarning:typer
    # core/sandbox/_spawn.py forks by design under its fork-safety
    # contract (module docstring); its module-level filter does not
    # survive pytest's per-test filter reset, so the same
    # message-scoped ignore lives here for the test tiers.
    ignore:This process \(pid=\d+\) is multi-threaded, use of fork\(\) may lead to deadlocks in the child:DeprecationWarning
