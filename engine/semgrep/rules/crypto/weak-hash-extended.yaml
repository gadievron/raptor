rules:
  # V11.4.1 extended: weak hash detection for languages not covered in weak-hash.yaml
  # (Java, Python, and Go are handled there; JS, Ruby, PHP, Rust, and C are here)

  - id: raptor.crypto.weak-hash.js
    message: Weak hash function. Use SHA-256 or better for cryptographic purposes.
    languages: [javascript, typescript]
    severity: HIGH
    patterns:
      - pattern: crypto.createHash($ALG)
      - metavariable-regex:
          metavariable: $ALG
          # node accepts OpenSSL digest names case-insensitively
          regex: (?i)^["'](md5|sha-?1)["']$
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V11.4.1"]

  - id: raptor.crypto.weak-hash.ruby
    message: Weak hash function. Use SHA-256 or better for cryptographic purposes.
    languages: [ruby]
    severity: HIGH
    pattern-either:
      - pattern: Digest::MD5.hexdigest(...)
      - pattern: Digest::MD5.digest(...)
      - pattern: Digest::SHA1.hexdigest(...)
      - pattern: Digest::SHA1.digest(...)
      - pattern: OpenSSL::Digest.new("MD5")
      - pattern: OpenSSL::Digest.new("SHA1")
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V11.4.1"]

  # md5()/sha1() in PHP are pervasively used for non-security purposes
  # (cache keys, ETags, dedupe), so an unconditional HIGH is a noise cannon.
  # The genuinely HIGH case — hashing a password — is covered with context by
  # raptor.crypto.password.weak-hash.php in insecure-password-hash.yaml.
  - id: raptor.crypto.weak-hash.php
    message: >
      Weak hash function. Use hash('sha256', ...) or better for cryptographic
      purposes. If this hashes a password, see the HIGH finding from
      raptor.crypto.password.weak-hash.php.
    languages: [php]
    severity: MEDIUM
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V11.4.1"]

  - id: raptor.crypto.weak-hash.rust
    message: Weak hash function. Use SHA-256 or better for cryptographic purposes.
    languages: [rust]
    severity: HIGH
    pattern-either:
      - pattern: Md5::new()
      - pattern: Sha1::new()
      # one-shot digest API of the RustCrypto `digest` trait
      - pattern: Md5::digest(...)
      - pattern: Sha1::digest(...)
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V11.4.1"]

  - id: raptor.crypto.weak-hash.c
    message: Weak hash function. Avoid MD5 and SHA-1 for security purposes. Use SHA-256 or better.
    languages: [c, cpp]
    severity: HIGH
    pattern-either:
      - pattern: MD5_Init(...)
      - pattern: MD5(...)
      - pattern: SHA1_Init(...)
      - pattern: SHA1(...)
      # OpenSSL EVP surface: EVP_md5()/EVP_sha1() only exist to select the
      # digest for EVP_DigestInit-family / HMAC setup calls
      - pattern: EVP_md5()
      - pattern: EVP_sha1()
    metadata:
      cwe: ["CWE-328"]
      asvs: ["V11.4.1"]
