rules:
  - id: raptor.crypto.pbkdf2.small-key.java
    message: Password-based key specification requests fewer than 128 bits. Review the consuming key factory, algorithm and application requirements before assessing key strength.
    languages: [java]
    severity: MEDIUM
    patterns:
      - pattern: new javax.crypto.spec.PBEKeySpec($PW, $SALT, $ITERS, $KEYLEN)
      - metavariable-comparison:
          metavariable: $KEYLEN
          comparison: $KEYLEN < 128
    metadata:
      cwe: ["CWE-326"]
      asvs: ["V3.11"]

  - id: raptor.crypto.pbkdf2.small-key.kotlin
    message: Password-based key specification requests fewer than 128 bits. Review the consuming key factory, algorithm and application requirements before assessing key strength.
    languages: [kotlin]
    severity: MEDIUM
    patterns:
      - pattern: javax.crypto.spec.PBEKeySpec($PW, $SALT, $ITERS, $KEYLEN)
      - metavariable-comparison:
          metavariable: $KEYLEN
          comparison: $KEYLEN < 128
    metadata:
      cwe: ["CWE-326"]
      asvs: ["V3.11"]

  - id: raptor.crypto.pbkdf2.small-key.python
    message: PBKDF2 call requests fewer than 16 output bytes. Review the call outcome and how the derived bytes are used before assessing key strength.
    languages: [python]
    severity: MEDIUM
    patterns:
      - pattern-either:
          - pattern: hashlib.pbkdf2_hmac($ALG, $PW, $SALT, $ITERS, $DKLEN)
          - pattern: hashlib.pbkdf2_hmac(..., dklen=$DKLEN, ...)
      - metavariable-comparison:
          metavariable: $DKLEN
          comparison: $DKLEN < 16
    metadata:
      cwe: ["CWE-326"]
      asvs: ["V3.11"]
