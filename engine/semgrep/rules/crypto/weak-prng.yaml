rules:
  # V11.5.1: All security-sensitive random values must use a CSPRNG with >= 128 bits of entropy.
  #
  # Severity note: a non-CSPRNG call with no usage context is the same finding
  # class in every language — the value may be fine for jitter or sampling and
  # catastrophic for a token. All rules in this file are therefore MEDIUM;
  # context-aware rules (password/token/key sinks) are where HIGH belongs.

  - id: raptor.crypto.prng.math-random.js
    message: >
      Math.random() is not cryptographically secure. Use crypto.getRandomValues()
      or crypto.randomBytes() for tokens, keys, and secrets.
    languages: [javascript, typescript]
    severity: MEDIUM
    pattern: Math.random()
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]

  - id: raptor.crypto.prng.random-module.python
    message: >
      Python's random module is not cryptographically secure. Use secrets or
      os.urandom() for tokens, keys, nonces, and passwords.
    languages: [python]
    severity: MEDIUM
    pattern-either:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
      - pattern: random.choices(...)
      - pattern: random.randbytes(...)
      - pattern: random.randrange(...)
      - pattern: random.getrandbits(...)
      - pattern: random.uniform(...)
      - pattern: random.shuffle(...)
      - pattern: random.sample(...)
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]

  - id: raptor.crypto.prng.java-random.java
    message: >
      java.util.Random is not cryptographically secure (and a fixed seed makes
      the sequence fully predictable). Use java.security.SecureRandom for
      tokens, keys, and secrets.
    languages: [java, kotlin]
    severity: MEDIUM
    pattern-either:
      - pattern: new Random()
      - pattern: new Random($SEED)
      - pattern: Math.random()
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]

  - id: raptor.crypto.prng.math-rand.go
    message: >
      math/rand is not cryptographically secure. Use crypto/rand for tokens, keys,
      and security-sensitive values.
    languages: [go]
    severity: MEDIUM
    pattern-either:
      - pattern: rand.Intn(...)
      - pattern: rand.Int63n(...)
      - pattern: rand.Int31()
      - pattern: rand.Int31n(...)
      - pattern: rand.Uint32()
      - pattern: rand.Uint64()
      - pattern: rand.Perm(...)
      - pattern: rand.Float64()
      # zero-arg form is unambiguous: crypto/rand.Int takes (io.Reader, *big.Int)
      - pattern: rand.Int()
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]

  # rand.Read exists in BOTH math/rand and crypto/rand with the same shape, so
  # this rule is anchored on the math/rand import; crypto/rand.Read stays clean.
  - id: raptor.crypto.prng.math-rand-read.go
    message: >
      math/rand.Read fills the buffer from a non-cryptographic PRNG. Use
      crypto/rand.Read for keys, nonces, tokens, and salts.
    languages: [go]
    severity: MEDIUM
    patterns:
      - pattern: rand.Read(...)
      - pattern-inside: |
          import "math/rand"
          ...
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]

  - id: raptor.crypto.prng.rand.c
    message: >
      rand() is not cryptographically secure. Use getrandom() or read from
      /dev/urandom for security-sensitive values.
    languages: [c, cpp]
    severity: MEDIUM
    pattern: rand()
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]

  - id: raptor.crypto.prng.rand.ruby
    message: >
      Ruby's rand is not cryptographically secure. Use SecureRandom for tokens,
      keys, and security-sensitive values.
    languages: [ruby]
    severity: MEDIUM
    pattern-either:
      - pattern: rand(...)
      - pattern: Random.rand(...)
    metadata:
      cwe: ["CWE-338"]
      asvs: ["V11.5.1"]
