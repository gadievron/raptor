rules:
  # Repeated-argument heuristics. Literal nonces are reported separately by
  # insecure-iv-or-nonce.yaml. Python encrypt APIs differ: the first argument
  # may be plaintext rather than a nonce. Confirm the API, effective key,
  # value stability and operation context before concluding nonce reuse.

  - id: raptor.crypto.nonce.reuse.spec.java
    message: >
      Potential nonce reuse. The same GCMParameterSpec instance initialises two
      Cipher operations, so both use the same IV under (typically) the same key.
      Generate a fresh nonce per encryption.
    languages: [java, kotlin]
    severity: HIGH
    patterns:
      - pattern: |
          $S = new GCMParameterSpec(...);
          ...
          $C1.init($M1, $K1, $S);
          ...
          $C2.init($M2, $K2, $S);
      - pattern-not: |
          $S = new GCMParameterSpec(...);
          ...
          $C1.init($M1, $K1, $S);
          ...
          $S = ...;
          ...
          $C2.init($M2, $K2, $S);
    metadata:
      cwe: ["CWE-323", "CWE-330"]
      asvs: ["V7.3"]

  - id: raptor.crypto.nonce.reuse.two-calls.python
    message: >-
      Candidate: two encrypt calls share a first-argument expression. Confirm
      that this API takes a nonce in that position, and verify the effective
      key and argument value across both calls before treating this as nonce reuse.
    languages: [python]
    severity: HIGH
    patterns:
      - pattern: |
          $C.encrypt($NONCE, ...)
          ...
          $C.encrypt($NONCE, ...)
      - pattern-not: |
          $C.encrypt($NONCE, ...)
          ...
          $NONCE = ...
          ...
          $C.encrypt($NONCE, ...)
      - pattern-not: |
          $C.encrypt($NONCE, ...)
          ...
          $C = ...
          ...
          $C.encrypt($NONCE, ...)
      - metavariable-regex:
          metavariable: $NONCE
          regex: "^[A-Za-z_][A-Za-z0-9_.]*$"
    metadata:
      cwe: ["CWE-323", "CWE-330"]
      asvs: ["V7.3"]

  - id: raptor.crypto.nonce.reuse.loop.python
    message: >-
      Candidate: an encrypt call in a loop uses an expression assigned outside
      the loop. Confirm that this API takes a nonce in that position, and verify
      multiple iterations and key/value stability before treating this as nonce reuse.
    languages: [python]
    severity: HIGH
    patterns:
      - pattern: |
          $NONCE = ...
          ...
          for $X in $ITER:
              ...
              $C.encrypt($NONCE, ...)
      - pattern-not: |
          $NONCE = ...
          ...
          for $X in $ITER:
              ...
              $NONCE = ...
              ...
              $C.encrypt($NONCE, ...)
      - metavariable-regex:
          metavariable: $NONCE
          regex: "^[A-Za-z_][A-Za-z0-9_.]*$"
    metadata:
      cwe: ["CWE-323", "CWE-330"]
      asvs: ["V7.3"]
