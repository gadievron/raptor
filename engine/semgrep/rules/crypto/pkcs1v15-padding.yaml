rules:
  # V11.3.1: PKCS#1 v1.5 padding is vulnerable to Bleichenbacher oracle attacks.
  # Use OAEP for encryption and PSS for signatures.

  - id: raptor.crypto.rsa.pkcs1v15-encrypt.java
    message: >
      RSA cipher construction is a padding-oracle review candidate. Check the
      selected provider's defaults for bare RSA, the operation performed and
      whether the surrounding protocol exposes distinguishable decryption
      failures. Prefer an explicit OAEP transformation for new encryption.
    languages: [java, kotlin]
    severity: HIGH
    patterns:
      # (?i): JCA transformation lookup is case-insensitive per spec.
      # Bare "RSA" defaults to PKCS1 padding on every mainstream
      # provider, hence the optional suffix.
      - pattern: javax.crypto.Cipher.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)^"rsa(/ecb/pkcs1padding)?"$
    metadata:
      cwe: ["CWE-780", "CWE-327"]
      asvs: ["V11.3.1"]
      references: ["https://link.springer.com/chapter/10.1007/BFb0055716"]

  - id: raptor.crypto.rsa.pkcs1v15-encrypt.python
    message: >
      PKCS1_v1_5 cipher construction is a padding-oracle review candidate.
      Check how the object is used and whether the surrounding protocol exposes
      distinguishable decryption failures. Prefer Crypto.Cipher.PKCS1_OAEP for
      new encryption.
    languages: [python]
    severity: HIGH
    pattern: Crypto.Cipher.PKCS1_v1_5.new(...)
    metadata:
      cwe: ["CWE-780", "CWE-327"]
      asvs: ["V11.3.1"]

  - id: raptor.crypto.rsa.pkcs1v15.go
    message: >
      PKCS#1 v1.5 RSA encryption/decryption is a padding-oracle review candidate.
      Prefer rsa.EncryptOAEP / rsa.DecryptOAEP for new code.
      DecryptPKCS1v15SessionKey includes mitigations whose effectiveness depends
      on random fallback-key preparation and the surrounding protocol.
      Signatures are handled by raptor.crypto.rsa.pkcs1v15-sign.go.
    languages: [go]
    severity: HIGH
    pattern-either:
    - patterns:
      - pattern-inside: |-
          package $PACKAGE
          import "crypto/rsa"
          ...
      - pattern-not-inside: |-
          package $PACKAGE
          import $EXPLICIT "crypto/rsa"
          ...
      - pattern-either:
        - pattern: rsa.DecryptPKCS1v15(...)
        - pattern: rsa.DecryptPKCS1v15SessionKey(...)
        - pattern: rsa.EncryptPKCS1v15(...)
    - patterns:
      - pattern-inside: |-
          package $PACKAGE
          import $RSA "crypto/rsa"
          ...
      - pattern-either:
        - pattern: $RSA.DecryptPKCS1v15(...)
        - pattern: $RSA.DecryptPKCS1v15SessionKey(...)
        - pattern: $RSA.EncryptPKCS1v15(...)
    metadata:
      cwe: ["CWE-780", "CWE-327"]
      asvs: ["V11.3.1"]

  # PKCS#1 v1.5 *signing* is not Bleichenbacher-vulnerable (that attack needs
  # a decryption padding oracle); it is merely a legacy scheme. Prefer PSS for
  # new signature generation. Verification is deliberately not flagged:
  # verifying legacy v1.5 signatures is unavoidable for interoperability.
  - id: raptor.crypto.rsa.pkcs1v15-sign.go
    message: >
      PKCS#1 v1.5 signature generation is a legacy scheme. Prefer rsa.SignPSS
      for new signatures; keep v1.5 only where interoperability requires it.
    languages: [go]
    severity: MEDIUM
    pattern-either:
    - patterns:
      - pattern-inside: |-
          package $PACKAGE
          import "crypto/rsa"
          ...
      - pattern-not-inside: |-
          package $PACKAGE
          import $EXPLICIT "crypto/rsa"
          ...
      - pattern: rsa.SignPKCS1v15(...)
    - patterns:
      - pattern-inside: |-
          package $PACKAGE
          import $RSA "crypto/rsa"
          ...
      - pattern: $RSA.SignPKCS1v15(...)
    metadata:
      cwe: ["CWE-327"]
      asvs: ["V11.3.1"]

  - id: raptor.crypto.rsa.pkcs1v15.node
    message: >
      RSA_PKCS1_PADDING use is a padding-oracle review candidate. Review the
      encryption/decryption operation, runtime protections and whether the
      surrounding protocol exposes distinguishable decryption failures.
      Prefer RSA_PKCS1_OAEP_PADDING for new encryption.
    languages: [javascript, typescript]
    severity: HIGH
    pattern-either:
      - pattern: "crypto.privateDecrypt({padding: crypto.constants.RSA_PKCS1_PADDING, ...}, ...)"
      - pattern: "crypto.publicEncrypt({padding: crypto.constants.RSA_PKCS1_PADDING, ...}, ...)"
    metadata:
      cwe: ["CWE-780", "CWE-327"]
      asvs: ["V11.3.1"]
