rules:
  # Pre-fix the patterns matched only exact literals ("... password: "
  # matched the literal three-dots string; receivers were hardcoded
  # `logger`/`log`) — effectively dead on real code (U12-F103). The
  # rule now keys on a secret-shaped key prefix (`password:`,
  # `token=`, ...) inside the format/message literal of any standard
  # logging method, with the value concatenated, %-formatted, or
  # passed as a format argument.
  - id: raptor.logging.secrets.plaintext
    message: Logging may contain secrets (password, token, key); mask before logging.
    languages: [python, java, javascript]
    severity: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $LOG.$METHOD("=~/(?i)(password|passwd|pwd|secret|token|api[_-]?key|credential)\s*[:=]/" + $X, ...)
          - pattern: $LOG.$METHOD("=~/(?i)(password|passwd|pwd|secret|token|api[_-]?key|credential)\s*[:=]/" % $X, ...)
          - pattern: $LOG.$METHOD("=~/(?i)(password|passwd|pwd|secret|token|api[_-]?key|credential)\s*[:=]/", $X, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(trace|debug|info|warn|warning|error|critical|exception|log|fatal)$
    metadata:
      cwe: ["CWE-532"]
