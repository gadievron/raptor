# raptor: confirm-only
# Word-splitting checks do not refute all CWE-88 option-parsing risks.
rules:
  # CWE-88: argument injection — request data lands inside a shell
  # command string with no per-argument quoting. escapeshellcmd is
  # deliberately NOT a sanitizer: it neutralizes shell metacharacters
  # for the command as a whole but leaves spaces and leading dashes
  # untouched, so a value placed in argument position can still smuggle
  # extra options/arguments ("-oProxyCommand=...", "--include=/etc/*").
  # escapeshellarg (one quoted argument) and modeled numeric results
  # neutralize word splitting, not the target program's option parser.
  #
  # Known FP modes:
  #   - Values validated by means the rule cannot see (ctype_alnum
  #     guard, preg_match allowlist in an early-return branch) still
  #     fire — guard-shaped validation is invisible to taint mode.
  #   - Overlaps CWE-78 command injection on purpose: an unquoted
  #     tainted value is both; reviews emitting either class get a
  #     verifying chain.
  # Known FN modes:
  #   - escapeshellarg clears taint, but a quoted standalone value in
  #     OPTION position ("-oProxyCommand=...") is still argument
  #     injection when the program treats leading-dash words as
  #     options — the sanitizer neutralizes word splitting, not the
  #     callee's option parsing. Stated residual, not expressible
  #     without knowing the callee's argv contract.
  #   - Taint through helper indirection (a getter function wrapping
  #     the superglobal read) is invisible to single-function taint.
  - id: raptor.php.argument-injection.exec-family
    mode: taint
    languages: [php]
    severity: HIGH
    message: >
      Request data is concatenated into a shell command string without
      escapeshellarg. Even under escapeshellcmd, spaces and leading
      dashes survive, so the attacker can append extra arguments or
      options to the invoked program (argument injection). Quote each
      value with escapeshellarg or avoid the shell (proc_open with an
      argument array).
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
      # Split call spellings so shadow checks use a literal function name;
      # global calls need no application-function shadow search.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: filter_input($INPUT, $NAME)
                  - pattern-not-inside: |
                      namespace $N;
                      $...BEFORE;
                      function filter_input(...) { ... }
                      $...AFTER;
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        function filter_input(...) { ... }
                        ...
                      }
              - patterns:
                  - pattern: $READER($INPUT, $NAME)
                  - metavariable-regex:
                      metavariable: $READER
                      constant-propagation: false
                      regex: '(?i)^\\filter_input$'
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: '^\\?(?:INPUT_GET|INPUT_POST|INPUT_COOKIE)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $INPUT = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $INPUT = $VALUE;
                ...
              }
        exact: true
      # Split call spellings so shadow checks use a literal function name;
      # global calls need no application-function shadow search.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: filter_input($INPUT, $NAME, $FILTER)
                  - pattern-not-inside: |
                      namespace $N;
                      $...BEFORE;
                      function filter_input(...) { ... }
                      $...AFTER;
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        function filter_input(...) { ... }
                        ...
                      }
              - patterns:
                  - pattern: $READER($INPUT, $NAME, $FILTER)
                  - metavariable-regex:
                      metavariable: $READER
                      constant-propagation: false
                      regex: '(?i)^\\filter_input$'
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: '^\\?(?:INPUT_GET|INPUT_POST|INPUT_COOKIE)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $INPUT = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $INPUT = $VALUE;
                ...
              }
          - metavariable-regex:
              metavariable: $FILTER
              constant-propagation: false
              regex: '^\\?(?:FILTER_DEFAULT|FILTER_UNSAFE_RAW)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $FILTER = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $FILTER = $VALUE;
                ...
              }
        exact: true
    pattern-sanitizers:
      - patterns:
          - pattern: $CONVERTER(...)
          - metavariable-regex:
              metavariable: $CONVERTER
              constant-propagation: false
              regex: '(?i)^\\?(?:escapeshellarg|intval|floatval|count|sizeof|strlen)$'
        exact: true
      - pattern-either:
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: (bool) $X
        exact: true
      # Assignment forms preserve return-only sanitization on newer engines.
      - patterns:
          - pattern: $SAFE = $CONVERTER(...)
          - metavariable-regex:
              metavariable: $CONVERTER
              constant-propagation: false
              regex: '(?i)^\\?(?:escapeshellarg|intval|floatval|count|sizeof|strlen)$'
          - metavariable-regex:
              metavariable: $SAFE
              regex: '^\$[A-Za-z_][A-Za-z0-9_]*$'
        exact: true
      - patterns:
          - pattern-either:
              - pattern: $SAFE = (int) $X
              - pattern: $SAFE = (float) $X
              - pattern: $SAFE = (bool) $X
          - metavariable-regex:
              metavariable: $SAFE
              regex: '^\$[A-Za-z_][A-Za-z0-9_]*$'
        exact: true
    pattern-sinks:
      # Only command argument 1 is parsed as a command string. Output/status,
      # mode, descriptor, cwd and environment arguments do not supply its words.
      - patterns:
          - pattern: $SINK($COMMAND, ...)
          - metavariable-regex:
              metavariable: $SINK
              constant-propagation: false
              regex: '(?i)^\\?(?:exec|system|passthru|shell_exec|popen)$'
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: $SINK($COMMAND, ...)
          - metavariable-regex:
              metavariable: $SINK
              constant-propagation: false
              regex: '(?i)^\\?proc_open$'
          # Literal argv arrays bypass command-string word splitting.
          # Program-specific option parsing remains outside this rule.
          - pattern-not: $SINK([...], ...)
          - pattern-not: $SINK(array(...), ...)
          - focus-metavariable: $COMMAND
    metadata:
      cwe: ["CWE-88"]
