# raptor: confirm-only
# Predictable generators stored under security-material names are candidates,
# not a whole-class safety oracle. Bare jitter/sampling calls stay silent.
# Qualified/case-varied builtin spellings are recognized syntactically; method
# and unrelated namespace calls are excluded. Function shadows/import aliases
# still require review. Hashing predictable input does not add entropy.
# Destinations are plain variables, named instance/static properties or literal
# array keys. Dynamic selectors do not establish security-material storage.
# pad remains a plain-variable-only anchor, avoiding wire-padding properties.
# Neutral intermediate aliases/direct returns and semantically unrelated
# security-shaped names remain name-heuristic limitations.
# Older PHP AST spans can omit a literal field selector's closing brace;
# the field guards tolerate that span without accepting variable selectors.
# The adjacent literal-key fallback is restricted to local array writes and
# direct zero-argument generators, avoiding unknown intervening mutations.
rules:
  - id: raptor.php.weak-prng-token.var
    languages:
      - php
    severity: HIGH
    message: >-
      A security-named value contains output from a non-cryptographic generator.
      Check its entropy provenance; use random_bytes()/random_int() for
      security-sensitive randomness.
    patterns:
      - pattern: $VAR = <... $RAND(...) ...>;
      - metavariable-regex:
          metavariable: $RAND
          regex: (?i)^\\?(?:mt_rand|rand|uniqid|lcg_value|str_shuffle|array_rand)$
          constant-propagation: false
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^\$[a-z0-9_]*(?<![a-z])(token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset|pad)(?![a-z])[a-z0-9_]*$
    metadata:
      cwe:
        - CWE-338
  - id: raptor.php.weak-prng-token.property
    languages:
      - php
    severity: HIGH
    message: >-
      A security-named value contains output from a non-cryptographic generator.
      Check its entropy provenance; use random_bytes()/random_int() for
      security-sensitive randomness.
    patterns:
      - pattern: $DEST = <... $RAND(...) ...>;
      - metavariable-regex:
          metavariable: $RAND
          regex: (?i)^\\?(?:mt_rand|rand|uniqid|lcg_value|str_shuffle|array_rand)$
          constant-propagation: false
      - metavariable-regex:
          metavariable: $DEST
          constant-propagation: false
          regex: (?i)^[^\n;]+(?:->\s*(?:[a-z0-9_]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_]*|(?:'[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*")|\{\s*(?:'[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*")\s*\}?)|::\s*\$[a-z0-9_]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_]*)$
    metadata:
      cwe:
        - CWE-338
  - id: raptor.php.weak-prng-token.array-store
    languages:
      - php
    severity: HIGH
    message: >-
      A security-named value contains output from a non-cryptographic generator.
      Check its entropy provenance; use random_bytes()/random_int() for
      security-sensitive randomness.
    metadata:
      cwe:
        - CWE-338
    pattern-either:
      - patterns:
          - pattern: $ARR[$KEY] = <... $RAND(...) ...>;
          - metavariable-regex:
              metavariable: $RAND
              regex: (?i)^\\?(?:mt_rand|rand|uniqid|lcg_value|str_shuffle|array_rand)$
              constant-propagation: false
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*")$
      - patterns:
          - pattern: '$KEY_ALIAS = $KEY_LITERAL;

              $ARRAY_ALIAS[$KEY_ALIAS] = $RAND();'
          - metavariable-regex:
              metavariable: $KEY_LITERAL
              constant-propagation: false
              regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:token|secret|nonce|otp|csrf|apikey|api_key|sessid|session_id|activation|reset)(?![a-z])[a-z0-9_.:-]*")$
          - metavariable-regex:
              metavariable: $KEY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $ARRAY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $RAND
              constant-propagation: false
              regex: (?i)^\\?(?:mt_rand|rand|uniqid|lcg_value)$
