# raptor: confirm-only
# This rule covers immediate quoted-attribute encoding mistakes only.
# A zero-match cannot refute the wider CWE-116 class.
rules:
  # Quote bits are independent: bit 0 protects apostrophes; bit 1
  # protects double quotes. Other ENT_* flags do not enable quoting.
  - id: raptor.php.attr-encoding.single-quote-attr
    languages: [php]
    severity: MEDIUM
    message: >
      The encoding flags leave the surrounding single quote unescaped
      in this HTML attribute. If the value is untrusted, it can close the
      attribute and add attacker-chosen markup. Use ENT_QUOTES and keep
      the attribute quoted.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $ENCODER($X, $FLAGS, ...)
              - metavariable-regex:
                  metavariable: $FLAGS
                  constant-propagation: false
                  regex: '\A\\?(?:ENT_COMPAT|ENT_NOQUOTES|ENT_IGNORE|ENT_SUBSTITUTE|ENT_DISALLOWED|ENT_HTML401|ENT_XML1|ENT_XHTML|ENT_HTML5)(?:\s*+\|\s*+\\?(?:ENT_COMPAT|ENT_NOQUOTES|ENT_IGNORE|ENT_SUBSTITUTE|ENT_DISALLOWED|ENT_HTML401|ENT_XML1|ENT_XHTML|ENT_HTML5))*\z'
          - patterns:
              - pattern: $ENCODER($X, $FLAGS, ...)
              - metavariable-regex:
                  metavariable: $FLAGS
                  constant-propagation: false
                  regex: '\A(?:0|[1-9][0-9]{0,8})\z'
              - metavariable-comparison:
                  metavariable: $FLAGS
                  comparison: int($FLAGS) % 2 == 0
      - metavariable-regex:
          metavariable: $ENCODER
          constant-propagation: false
          regex: '(?i)^\\?(?:htmlspecialchars|htmlentities)$'
      # Match the encoder itself with \K: no concatenation operand splits,
      # and an earlier call cannot borrow a later call's attribute context.
      # Literal segments are bounded; complex templates remain out of scope.
      # Numbered atoms keep old PCRE engines from unrolling large alternatives.
      - pattern-regex: |-
          (?x)
          "
          (?1){0,512}
          <[A-Za-z]
          (?2){0,512}
          [ \t]+[A-Za-z_:][A-Za-z0-9_:.-]*+[ \t]*+=[ \t]*+'
          (?3){0,512}
          "\s*+\.\s*+\K\\?(?i:htmlspecialchars|htmlentities)\b
          (?(DEFINE)
            ((?:[^"\\\n]|\\[\\"$nrtvef]))
            ((?:[^<>"\\\n]|\\[\\"$nrtvef]))
            ((?:[^'<>"\\\n]|\\[\\"$nrtvef]))
          )
    metadata:
      cwe: ["CWE-116"]
  # Quote bits are independent: bit 0 protects apostrophes; bit 1
  # protects double quotes. Other ENT_* flags do not enable quoting.
  - id: raptor.php.attr-encoding.noquotes-double-attr
    languages: [php]
    severity: MEDIUM
    message: >
      The encoding flags leave the surrounding double quote unescaped
      in this HTML attribute. If the value is untrusted, it can close the
      attribute and add attacker-chosen markup. Use ENT_QUOTES and keep
      the attribute quoted.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $ENCODER($X, $FLAGS, ...)
              - metavariable-regex:
                  metavariable: $FLAGS
                  constant-propagation: false
                  regex: '\A\\?(?:ENT_NOQUOTES|ENT_IGNORE|ENT_SUBSTITUTE|ENT_DISALLOWED|ENT_HTML401|ENT_XML1|ENT_XHTML|ENT_HTML5)(?:\s*+\|\s*+\\?(?:ENT_NOQUOTES|ENT_IGNORE|ENT_SUBSTITUTE|ENT_DISALLOWED|ENT_HTML401|ENT_XML1|ENT_XHTML|ENT_HTML5))*\z'
          - patterns:
              - pattern: $ENCODER($X, $FLAGS, ...)
              - metavariable-regex:
                  metavariable: $FLAGS
                  constant-propagation: false
                  regex: '\A(?:0|[1-9][0-9]{0,8})\z'
              - metavariable-comparison:
                  metavariable: $FLAGS
                  comparison: int($FLAGS) % 4 < 2
      - metavariable-regex:
          metavariable: $ENCODER
          constant-propagation: false
          regex: '(?i)^\\?(?:htmlspecialchars|htmlentities)$'
      # Match the encoder itself with \K: no concatenation operand splits,
      # and an earlier call cannot borrow a later call's attribute context.
      # Literal segments are bounded; complex templates remain out of scope.
      # Numbered atoms keep old PCRE engines from unrolling large alternatives.
      - pattern-regex: |-
          (?x)
          '
          (?1){0,512}
          <[A-Za-z]
          (?2){0,512}
          [ \t]+[A-Za-z_:][A-Za-z0-9_:.-]*+[ \t]*+=[ \t]*+"
          (?3){0,512}
          '\s*+\.\s*+\K\\?(?i:htmlspecialchars|htmlentities)\b
          (?(DEFINE)
            ((?:[^'\\\n]|\\[\\']))
            ((?:[^<>'\\\n]|\\[\\']))
            ((?:[^"<>'\\\n]|\\[\\']))
          )
    metadata:
      cwe: ["CWE-116"]
