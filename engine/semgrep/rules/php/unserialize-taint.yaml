rules:
  # CWE-502: deserialization of untrusted data — request data reaching
  # unserialize() with no class restriction. A serialized object
  # string instantiates any autoloadable class, so magic methods
  # (__wakeup/__destruct/__toString) on any loaded gadget run with
  # attacker-chosen properties. Direct superglobal arguments, nested
  # array-field reads, and single-assignment hops are all in scope
  # (intraprocedural taint); decoding wrappers (base64_decode and
  # friends) propagate taint through to the sink.
  #
  # Only the ONE-argument unserialize form is the sink: the two-arg
  # form carries an options array, and 'allowed_classes' => false is
  # this rule's own recommended remediation — the rule must stay
  # silent on it.
  #
  # Known FP modes:
  #   - Integrity checks the rule cannot see (an hash_equals/HMAC
  #     guard branch before the call, a preg_match shape check) still
  #     fire — guard-shaped validation is invisible to taint mode.
  # Known FN modes:
  #   - The two-arg form with a PERMISSIVE options array
  #     ('allowed_classes' => true, or a gadget-bearing class list) is
  #     out of the one-arg sink scope and stays silent — stated
  #     residual; distinguishing safe from unsafe options arrays needs
  #     value analysis the pattern cannot express.
  #   - Taint through helper indirection (a getter function wrapping
  #     the superglobal read) is invisible to single-function taint.
  - id: raptor.php.unserialize-taint.request-data
    mode: taint
    languages: [php]
    severity: HIGH
    message: >
      Request data reaches unserialize() with no class restriction. A
      serialized-object payload instantiates any autoloadable class
      and its magic methods run with attacker-chosen properties
      (object injection). Pass a strict class allowlist
      (unserialize($v, ['allowed_classes' => false])) or move the
      format to json_decode.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
    pattern-sinks:
      - pattern: unserialize($DATA)
    metadata:
      cwe: ["CWE-502"]
