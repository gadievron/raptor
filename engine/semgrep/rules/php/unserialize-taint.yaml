rules:
  # CWE-502: deserialization of untrusted data — request data reaching
  # unserialize() with no class restriction. A serialized object
  # string instantiates any autoloadable class, so magic methods
  # (__wakeup/__destruct/__toString) on any loaded gadget run with
  # attacker-chosen properties. Direct superglobal arguments, nested
  # array-field reads, and single-assignment hops are all in scope
  # (intraprocedural taint); decoding wrappers (base64_decode and
  # friends) propagate taint through to the sink; the fully-qualified
  # (\unserialize) and error-suppressed (@unserialize) spellings
  # match.
  #
  # Two-arg calls: recognize complete flat literal arrays containing
  # allowed_classes boolean policies and/or max_depth. Omitting the
  # policy allows classes; repeated literal policies use the last value.
  # Depth values are decimal integers or simple local/index reads.
  # Options taint does not stand in for serialized-input taint.
  #
  # Known limitations: validation/integrity guards remain invisible.
  # Taint is intraprocedural. Class lists, computed keys, unpacking,
  # unknown options and other depth expressions are outside this narrow
  # option model. A silent result never establishes safe deserialization.
  - id: raptor.php.unserialize-taint.request-data
    mode: taint
    languages: [php]
    severity: HIGH
    message: >
      Request data reaches unserialize() with unrestricted class
      instantiation (object injection). Prefer a non-object data format
      such as JSON for untrusted input. If serialized data is unavoidable,
      authenticate it and restrict allowed classes; class restrictions
      alone do not make untrusted deserialization safe.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
      # Split call spellings so shadow checks use a literal function name;
      # global calls need no application-function shadow search.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: filter_input($INPUT, $NAME)
                  - pattern-not-inside: |
                      namespace $N;
                      $...BEFORE;
                      function filter_input(...) { ... }
                      $...AFTER;
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        function filter_input(...) { ... }
                        ...
                      }
              - patterns:
                  - pattern: $READER($INPUT, $NAME)
                  - metavariable-regex:
                      metavariable: $READER
                      constant-propagation: false
                      regex: '(?i)^\\filter_input$'
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: '^\\?(?:INPUT_GET|INPUT_POST|INPUT_COOKIE)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $INPUT = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $INPUT = $VALUE;
                ...
              }
        exact: true
      # Split call spellings so shadow checks use a literal function name;
      # global calls need no application-function shadow search.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: filter_input($INPUT, $NAME, $FILTER)
                  - pattern-not-inside: |
                      namespace $N;
                      $...BEFORE;
                      function filter_input(...) { ... }
                      $...AFTER;
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        function filter_input(...) { ... }
                        ...
                      }
              - patterns:
                  - pattern: $READER($INPUT, $NAME, $FILTER)
                  - metavariable-regex:
                      metavariable: $READER
                      constant-propagation: false
                      regex: '(?i)^\\filter_input$'
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: '^\\?(?:INPUT_GET|INPUT_POST|INPUT_COOKIE)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $INPUT = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $INPUT = $VALUE;
                ...
              }
          - metavariable-regex:
              metavariable: $FILTER
              constant-propagation: false
              regex: '^\\?(?:FILTER_DEFAULT|FILTER_UNSAFE_RAW)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $FILTER = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $FILTER = $VALUE;
                ...
              }
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FUNCTION($DATA)
              - patterns:
                  - pattern: $FUNCTION($DATA, $OPTIONS)
                  # Recognize complete flat option shapes with a default or
                  # last-literal-true policy. Whitespace is possessive to avoid
                  # retrying hostile runs on rejected option shapes.
                  # PHP array(...) metavariable spans omit the array keyword.
                  - metavariable-regex:
                      metavariable: $OPTIONS
                      constant-propagation: false
                      regex: |-
                        (?x)\A
                        (?:\[|(?:(?i:array)(?&W))?\() (?&W)
                        (?:
                         ['"]max_depth['"](?&W)=>(?&W)(?:[0-9]+|\$[A-Za-z_][A-Za-z0-9_]*(?:(?&W)\[(?&W)(?:'[^'\\]*'|"[^"\\$]*")(?&W)\])?)(?:(?&W),(?&W)['"]max_depth['"](?&W)=>(?&W)(?:[0-9]+|\$[A-Za-z_][A-Za-z0-9_]*(?:(?&W)\[(?&W)(?:'[^'\\]*'|"[^"\\$]*")(?&W)\])?))*
                         |
                         (?:(?:['"]max_depth['"](?&W)=>(?&W)(?:[0-9]+|\$[A-Za-z_][A-Za-z0-9_]*(?:(?&W)\[(?&W)(?:'[^'\\]*'|"[^"\\$]*")(?&W)\])?)|['"]allowed_classes['"](?&W)=>(?&W)(?i:true|false))(?&W),(?&W))*
                         ['"]allowed_classes['"](?&W)=>(?&W)(?i:true)(?:(?&W),(?&W)['"]max_depth['"](?&W)=>(?&W)(?:[0-9]+|\$[A-Za-z_][A-Za-z0-9_]*(?:(?&W)\[(?&W)(?:'[^'\\]*'|"[^"\\$]*")(?&W)\])?))*
                        )?
                        (?&W),?(?&W) (?:\]|\))
                        \z
                        (?(DEFINE)
                          (?<W>
                            (?:\s++|/\*(?:[^*]++|\*(?!/))*+\*/
                              |//[^\r\n]*+(?:\r\n|[\r\n])
                              |\#[^\r\n]*+(?:\r\n|[\r\n]))*+
                          )
                        )
          - metavariable-regex:
              metavariable: $FUNCTION
              constant-propagation: false
              regex: '(?i)^\\?unserialize$'
          - focus-metavariable: $DATA
    metadata:
      cwe: ["CWE-502"]
