rules:
  # CWE-470: unsafe reflection — attacker-selected code unit. Request
  # data used as a variable-function name ($fn()), a callable handed
  # to call_user_func/call_user_func_array, a dynamically instantiated
  # class (new $cls), or a variable method name ($obj->$m()).
  #
  # Membership scope: in_array only sanitizes strict inline string
  # allowlists with a rejecting return/exit or literal fallback.
  # Other guard forms can still report safe code. The separate
  # array_key_exists/isset sanitizers require rejecting guards but
  # do not prove map contents or the complete key domain. Map-check
  # silence is not proof of safety.
  - id: raptor.php.unsafe-reflection.tainted-callable
    mode: taint
    languages: [php]
    severity: HIGH
    message: >
      Request data is used to select the code to execute (variable
      function, call_user_func callable, dynamic class instantiation,
      or variable method name). An attacker can invoke any defined
      function/class, e.g. system or an autoloadable gadget class.
      Route through a fixed allowlist (in_array($v, [...], true) or a
      literal-keyed dispatch map) before the call.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
      # Only unfiltered request reads are sources. Keep filter/options
      # selection literal, and taint the return value rather than arguments.
      - patterns:
          - pattern: $READER($INPUT, $NAME)
          - metavariable-regex:
              metavariable: $READER
              constant-propagation: false
              regex: '(?i)^\\?filter_input$'
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: '^\\?(?:INPUT_GET|INPUT_POST|INPUT_COOKIE)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              function $READER(...) { ... }
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                function $READER(...) { ... }
                ...
              }
          - pattern-not-inside: |
              namespace $N;
              ...
              const $INPUT = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $INPUT = $VALUE;
                ...
              }
        exact: true
      - patterns:
          - pattern: $READER($INPUT, $NAME, $FILTER)
          - metavariable-regex:
              metavariable: $READER
              constant-propagation: false
              regex: '(?i)^\\?filter_input$'
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: '^\\?(?:INPUT_GET|INPUT_POST|INPUT_COOKIE)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              function $READER(...) { ... }
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                function $READER(...) { ... }
                ...
              }
          - pattern-not-inside: |
              namespace $N;
              ...
              const $INPUT = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $INPUT = $VALUE;
                ...
              }
          - metavariable-regex:
              metavariable: $FILTER
              constant-propagation: false
              regex: '^\\?(?:FILTER_DEFAULT|FILTER_UNSAFE_RAW)$'
          - pattern-not-inside: |
              namespace $N;
              ...
              const $FILTER = $VALUE;
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                const $FILTER = $VALUE;
                ...
              }
        exact: true
    pattern-sanitizers:
      # A check is not a mutation: only a strict literal allowlist
      # with an exact rejecting branch establishes a value contract.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: |
                  if (!$CHECK($V, $ALLOWED, true)) {
                    return;
                  }
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $ALLOWED, true)) {
                        return $TERMINAL;
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $ALLOWED, true)) {
                        die($TERMINAL);
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $ALLOWED, true)) {
                        exit($TERMINAL);
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $ALLOWED, true)) {
                        $V = $DEFAULT;
                      }
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      constant-propagation: false
                      regex: '\A(?:''[^''\\]*''|"[^"\\$]*")\z'
          - pattern-either:
              - patterns:
                  - pattern: $CHECK(...)
                  - metavariable-regex:
                      metavariable: $CHECK
                      constant-propagation: false
                      regex: '(?i)^\\in_array$'
              - patterns:
                  - pattern: $CHECK(...)
                  - metavariable-regex:
                      metavariable: $CHECK
                      constant-propagation: false
                      regex: '(?i)^in_array$'
                  - pattern-not-inside: |
                      namespace $N;
                      ...
                      use function $IMPORTED;
                      ...
                  - pattern-not-inside: |
                      namespace $N;
                      ...
                      use function $IMPORTED as $ALIAS;
                      ...
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        use function $IMPORTED;
                        ...
                      }
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        use function $IMPORTED as $ALIAS;
                        ...
                      }
                  - pattern-not-inside: |
                      use function $IMPORTED;
                      ...
                  - pattern-not-inside: |
                      use function $IMPORTED as $ALIAS;
                      ...
          - metavariable-regex:
              metavariable: $V
              constant-propagation: false
              regex: '^\$[A-Za-z_][A-Za-z_0-9]*$'
          - metavariable-regex:
              metavariable: $ALLOWED
              constant-propagation: false
              regex: '\A\[\s*(?:''[^''\\]*''|"[^"\\$]*")(?:\s*,\s*(?:''[^''\\]*''|"[^"\\$]*"))*\s*,?\s*\]\z'
          - pattern-not-inside: |
              namespace $N;
              ...
              function $CHECK(...) { ... }
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                function $CHECK(...) { ... }
                ...
              }
          - focus-metavariable: $V
      # Membership only participates in a rejecting guard. This retains
      # the existing guarded-map heuristic; map contents are not proven.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: |
                  if (!$CHECK($V, $MAP)) {
                    return;
                  }
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $MAP)) {
                        return $TERMINAL;
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $MAP)) {
                        die($TERMINAL);
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $MAP)) {
                        exit($TERMINAL);
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!$CHECK($V, $MAP)) {
                        $V = $DEFAULT;
                      }
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      constant-propagation: false
                      regex: '\A(?:''[^''\\]*''|"[^"\\$]*")\z'
          - pattern-either:
              - patterns:
                  - pattern: $CHECK(...)
                  - metavariable-regex:
                      metavariable: $CHECK
                      constant-propagation: false
                      regex: '(?i)^\\array_key_exists$'
              - patterns:
                  - pattern: $CHECK(...)
                  - metavariable-regex:
                      metavariable: $CHECK
                      constant-propagation: false
                      regex: '(?i)^array_key_exists$'
                  - pattern-not-inside: |
                      namespace $N;
                      ...
                      use function $IMPORTED;
                      ...
                  - pattern-not-inside: |
                      namespace $N;
                      ...
                      use function $IMPORTED as $ALIAS;
                      ...
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        use function $IMPORTED;
                        ...
                      }
                  - pattern-not-inside: |
                      namespace $N {
                        ...
                        use function $IMPORTED as $ALIAS;
                        ...
                      }
                  - pattern-not-inside: |
                      use function $IMPORTED;
                      ...
                  - pattern-not-inside: |
                      use function $IMPORTED as $ALIAS;
                      ...
          - metavariable-regex:
              metavariable: $V
              constant-propagation: false
              regex: '^\$[A-Za-z_][A-Za-z_0-9]*$'
          - pattern-not-inside: |
              namespace $N;
              ...
              function $CHECK(...) { ... }
              ...
          - pattern-not-inside: |
              namespace $N {
                ...
                function $CHECK(...) { ... }
                ...
              }
          - focus-metavariable: $V
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: |
                  if (!isset($MAP[$V])) {
                    return;
                  }
              - patterns:
                  - pattern: |
                      if (!isset($MAP[$V])) {
                        return $TERMINAL;
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!isset($MAP[$V])) {
                        die($TERMINAL);
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!isset($MAP[$V])) {
                        exit($TERMINAL);
                      }
                  - metavariable-regex:
                      metavariable: $TERMINAL
                      constant-propagation: false
                      regex: '\A(?:(?:''[^''\\]*''|"[^"\\$]*")|null|true|false|[0-9]+)\z'
              - patterns:
                  - pattern: |
                      if (!isset($MAP[$V])) {
                        $V = $DEFAULT;
                      }
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      constant-propagation: false
                      regex: '\A(?:''[^''\\]*''|"[^"\\$]*")\z'
          - metavariable-regex:
              metavariable: $V
              constant-propagation: false
              regex: '^\$[A-Za-z_][A-Za-z_0-9]*$'
          - focus-metavariable: $V
    pattern-sinks:
      - patterns:
          - pattern: $FN(...)
          # $FN also matches the whole receiver->method expression.
          # A tainted object does not make its fixed method name dynamic;
          # the dedicated method sink below checks only the selector.
          - pattern-not: $OBJ->$METHOD(...)
          - focus-metavariable: $FN
      - patterns:
          - pattern-either:
              - pattern: call_user_func($FN, ...)
              - pattern: call_user_func_array($FN, ...)
          - focus-metavariable: $FN
      - patterns:
          - pattern: new $CLS(...)
          - focus-metavariable: $CLS
      - patterns:
          - pattern: $OBJ->$M(...)
          - focus-metavariable: $M
    metadata:
      cwe: ["CWE-470"]
