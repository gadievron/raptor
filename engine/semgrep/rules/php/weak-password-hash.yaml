rules:
  # CWE-327: md5/sha1 as a password digest. Both are broken for
  # authentication material: unsalted, GPU-friendly, rainbow-tabled.
  # Anchored on password-shaped names on either side of the call —
  # the argument (md5($password)) or the stored/compared lvalue
  # ($row['password'] = sha1(...)) — so md5-as-checksum/etag/cache-key
  # never fires.
  #
  # Known FP modes:
  #   - Name-anchored: a password digested under a neutral name
  #     ($input, $val) is missed (FN); a non-credential name carrying
  #     a letter-bounded pass/pwd segment ($pass_count, $pwd_dir)
  #     fires (FP). Letter-run continuations stay clean ($passthrough,
  #     $bypassed).
  #   - md5($password) used to derive a non-auth artifact (a legacy
  #     mail-hash of the password) still fires — digesting a password
  #     with md5 is the flagged act.
  - id: raptor.php.weak-password-hash.arg
    languages: [php]
    severity: HIGH
    message: >
      A password is digested with md5/sha1. Both are unsalted,
      fast, and precomputed-table friendly — offline recovery of user
      passwords from a leaked table is practical. Use
      password_hash()/password_verify().
    patterns:
      - pattern-either:
          - pattern: md5($P)
          - pattern: md5($P, ...)
          - pattern: sha1($P)
          - pattern: sha1($P, ...)
          # hash()'s algo argument is case-insensitive at runtime
          # ("MD5" == "md5"), so the match must be too; the regex
          # keeps hash("sha256", $password) out.
          - patterns:
              - pattern: hash($ALG, $P, ...)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["'](md5|sha1)["']$
      # Lookarounds instead of \b: underscores are word chars, so \b
      # never fires inside $user_password; a letter-boundary does.
      - metavariable-regex:
          metavariable: $P
          regex: (?i).*(?<![a-z])(pass(word|wd|phrase)?|pwd)(?![a-z]).*
    metadata:
      cwe: ["CWE-327"]
  - id: raptor.php.weak-password-hash.store
    languages: [php]
    severity: HIGH
    message: >
      A password-named field is assigned an md5/sha1 digest. Both are
      unsalted, fast, and precomputed-table friendly — offline
      recovery of user passwords from a leaked table is practical.
      Use password_hash()/password_verify().
    patterns:
      - pattern-either:
          - pattern: $LVAL = md5(...);
          - pattern: $LVAL = sha1(...);
          - pattern: $OBJ->$LVAL = md5(...);
          - pattern: $OBJ->$LVAL = sha1(...);
          - pattern: $ARR[$LVAL] = md5(...);
          - pattern: $ARR[$LVAL] = sha1(...);
      # Lookarounds instead of \b: underscores are word chars, so \b
      # never fires inside $password_hash; a letter-boundary does.
      - metavariable-regex:
          metavariable: $LVAL
          regex: (?i).*(?<![a-z])(pass(word|wd)?|pwd)(?![a-z]).*
    metadata:
      cwe: ["CWE-327"]
