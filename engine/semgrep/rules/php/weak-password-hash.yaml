# raptor: confirm-only
# These name-anchored password shapes cannot refute the whole CWE-327 class.
# Credentials must be data variables, literal/statically resolved array keys or named fields,
# rather than receiver names, dynamic selectors or literal/callee text.
# Argument checks inspect value expressions; stores require a direct digest.
# Native PHP ->/:: matching is permissive, so field-source guards distinguish
# fixed static properties from dynamic instance selectors with the same token.
# Names remain a heuristic: neutral aliases and unrelated password-named
# data, application function shadows/import aliases and arbitrary algorithms
# require separate review. A no-match is never a safety verdict.
# Older PHP AST spans can omit a literal field selector's closing brace;
# the field guards tolerate that span without accepting variable selectors.
# Adjacent literal-alias fallbacks use only plain local reads and stores,
# with no intervening statements or side-effecting arguments. They retain
# these forms on engines without PHP constant propagation.
rules:
  - id: raptor.php.weak-password-hash.arg
    languages:
      - php
    severity: HIGH
    message: >-
      A password-shaped value is digested with md5/sha1. Use
      password_hash()/password_verify() for password storage.
    metadata:
      cwe:
        - CWE-327
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $HASH($P, ...)
                  - metavariable-regex:
                      metavariable: $HASH
                      constant-propagation: false
                      regex: (?i)^\\?(?:md5|sha1)$
              - patterns:
                  - pattern: $HASH($ALG, $P, ...)
                  - metavariable-regex:
                      metavariable: $HASH
                      constant-propagation: false
                      regex: (?i)^\\?hash$
                  - metavariable-regex:
                      metavariable: $ALG
                      regex: (?i)^["'](?:md5|sha1)["']$
          - metavariable-pattern:
              metavariable: $P
              pattern-either:
                - patterns:
                    - pattern: $CREDENTIAL
                    - metavariable-regex:
                        metavariable: $CREDENTIAL
                        constant-propagation: false
                        regex: (?i)^\$[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*$
                    - pattern-not-inside: $CREDENTIAL->$FIELD
                    - pattern-not-inside: $CREDENTIAL[...]
                    - pattern-not-inside: $ARRAY[$CREDENTIAL]
                    - pattern-not-inside: $CREDENTIAL(...)
                    - pattern-not-inside: $OBJECT->$CREDENTIAL
                - patterns:
                    - pattern: $FIELD_VALUE
                    - metavariable-regex:
                        metavariable: $FIELD_VALUE
                        constant-propagation: false
                        regex: (?i)^[^\n;]+(?:->\s*(?:[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*|(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")|\{\s*(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")\s*\}?)|::\s*\$[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*)$
                    - metavariable-pattern:
                        metavariable: $FIELD_VALUE
                        pattern-either:
                          - pattern: $OBJECT->$FIELD
                          - pattern: $CLASS::$FIELD
                - patterns:
                    - pattern: $ARRAY[$CREDENTIAL]
                    - metavariable-regex:
                        metavariable: $CREDENTIAL
                        regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")$
      - patterns:
          - pattern: '$ALGORITHM = $ALGO_LITERAL;

              return $HASH($ALGORITHM, $PASSWORD);'
          - metavariable-regex:
              metavariable: $ALGO_LITERAL
              constant-propagation: false
              regex: (?i)^["'](?:md5|sha1)["']$
          - metavariable-regex:
              metavariable: $HASH
              constant-propagation: false
              regex: (?i)^\\?hash$
          - metavariable-regex:
              metavariable: $ALGORITHM
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $PASSWORD
              constant-propagation: false
              regex: (?i)^\$[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*$
      - patterns:
          - pattern: '$KEY_ALIAS = $KEY_LITERAL;

              return $HASH($ARRAY_ALIAS[$KEY_ALIAS]);'
          - metavariable-regex:
              metavariable: $KEY_LITERAL
              constant-propagation: false
              regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")$
          - metavariable-regex:
              metavariable: $KEY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $ARRAY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $HASH
              constant-propagation: false
              regex: (?i)^\\?(?:md5|sha1)$
      - patterns:
          - pattern: '$KEY_ALIAS = $KEY_LITERAL;

              return $HASH($ALGO_LITERAL, $ARRAY_ALIAS[$KEY_ALIAS]);'
          - metavariable-regex:
              metavariable: $KEY_LITERAL
              constant-propagation: false
              regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")$
          - metavariable-regex:
              metavariable: $KEY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $ARRAY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $HASH
              constant-propagation: false
              regex: (?i)^\\?hash$
          - metavariable-regex:
              metavariable: $ALGO_LITERAL
              constant-propagation: false
              regex: (?i)^["'](?:md5|sha1)["']$
  - id: raptor.php.weak-password-hash.store
    languages:
      - php
    severity: HIGH
    message: >-
      A password-named field is assigned an md5/sha1 digest. Use
      password_hash()/password_verify() for password storage.
    metadata:
      cwe:
        - CWE-327
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $DEST = $HASH(...);
                  - metavariable-regex:
                      metavariable: $HASH
                      constant-propagation: false
                      regex: (?i)^\\?(?:md5|sha1)$
              - patterns:
                  - pattern: $DEST = $HASH($ALG, ...);
                  - metavariable-regex:
                      metavariable: $HASH
                      constant-propagation: false
                      regex: (?i)^\\?hash$
                  - metavariable-regex:
                      metavariable: $ALG
                      regex: (?i)^["'](?:md5|sha1)["']$
          - pattern-either:
              - patterns:
                  - pattern: $NAME = $VALUE;
                  - metavariable-regex:
                      metavariable: $NAME
                      constant-propagation: false
                      regex: (?i)^\$[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*$
              - patterns:
                  - pattern-either:
                      - pattern: $OBJ->$NAME = $VALUE;
                      - pattern: $CLASS::$NAME = $VALUE;
                  - pattern: $DEST = $VALUE;
                  - metavariable-regex:
                      metavariable: $DEST
                      constant-propagation: false
                      regex: (?i)^[^\n;]+(?:->\s*(?:[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*|(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")|\{\s*(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")\s*\}?)|::\s*\$[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*)$
              - patterns:
                  - pattern: $ARR[$NAME] = $VALUE;
                  - metavariable-regex:
                      metavariable: $NAME
                      regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")$
      - patterns:
          - pattern: '$ALGORITHM = $ALGO_LITERAL;

              $PASSWORD = $HASH($ALGORITHM, $INPUT);'
          - metavariable-regex:
              metavariable: $ALGO_LITERAL
              constant-propagation: false
              regex: (?i)^["'](?:md5|sha1)["']$
          - metavariable-regex:
              metavariable: $HASH
              constant-propagation: false
              regex: (?i)^\\?hash$
          - metavariable-regex:
              metavariable: $ALGORITHM
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $PASSWORD
              constant-propagation: false
              regex: (?i)^\$[a-z0-9_]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_]*$
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
      - patterns:
          - pattern: '$KEY_ALIAS = $KEY_LITERAL;

              $ARRAY_ALIAS[$KEY_ALIAS] = $HASH($INPUT);'
          - metavariable-regex:
              metavariable: $KEY_LITERAL
              constant-propagation: false
              regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")$
          - metavariable-regex:
              metavariable: $KEY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $ARRAY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $HASH
              constant-propagation: false
              regex: (?i)^\\?(?:md5|sha1)$
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
      - patterns:
          - pattern: '$KEY_ALIAS = $KEY_LITERAL;

              $ARRAY_ALIAS[$KEY_ALIAS] = $HASH($ALGO_LITERAL, $INPUT);'
          - metavariable-regex:
              metavariable: $KEY_LITERAL
              constant-propagation: false
              regex: (?i)^(?:'[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*'|"[a-z0-9_.:-]*(?<![a-z])(?:pass(?:word|wd|phrase)?|pwd)(?![a-z])[a-z0-9_.:-]*")$
          - metavariable-regex:
              metavariable: $KEY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $ARRAY_ALIAS
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
          - metavariable-regex:
              metavariable: $HASH
              constant-propagation: false
              regex: (?i)^\\?hash$
          - metavariable-regex:
              metavariable: $ALGO_LITERAL
              constant-propagation: false
              regex: (?i)^["'](?:md5|sha1)["']$
          - metavariable-regex:
              metavariable: $INPUT
              constant-propagation: false
              regex: ^\$[A-Za-z_][A-Za-z_0-9]*$
