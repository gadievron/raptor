rules:
  - id: raptor.secrets.hardcoded.api_key.regex
    message: Text matches an access-key identifier, live-key prefix or private-key header pattern. Confirm whether it is real credential material and how it is used before concluding exposure. Keep real secrets out of source code and rotate any exposed secrets.
    languages: [python, javascript, java, go]
    severity: HIGH
    pattern-either:
      - pattern-regex: 'AKIA[0-9A-Z]{16}'
      - pattern-regex: 'sk_live_[0-9A-Za-z_-]{20,}'
      - pattern-regex: '-----BEGIN (?:PRIVATE|RSA PRIVATE) KEY-----'
    metadata:
      cwe: ["CWE-798"]
      asvs: ["V6.6"]
