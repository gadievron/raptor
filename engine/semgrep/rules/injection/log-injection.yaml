# CWE-117 concerns the serialized record boundary, not format-string safety.
# Generic logger receivers assume line-oriented text; confirm their encoder.
# Sanitizer contracts assume standard string operations, not custom overrides.
rules:
  # ---------------------------------------------------------------------------
  # Python — taint: web framework sources → logging message/arguments
  # CWE-117: Log Injection / Log Forging via CRLF in log messages.
  # Parameterization defers formatting; it does not escape CR/LF in %s.
  # ---------------------------------------------------------------------------
  - id: raptor.injection.log-injection.taint.python
    message: >-
      Untrusted data flows into the log message string. An attacker can
      inject CRLF sequences to forge log entries or corrupt log parsers.
      Strip or encode CR/LF for the final output format. Parameterized
      messages alone do not escape newlines; verify the configured encoder.
    languages: [python]
    severity: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          # Django
          - pattern: request.GET[...]
          - pattern: request.POST[...]
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.data[...]
          - pattern: request.query_params[...]
          # Flask
          - pattern: flask.request.args[...]
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.form[...]
          - pattern: flask.request.form.get(...)
          - pattern: flask.request.json[...]
          - pattern: flask.request.get_json(...)
          # FastAPI / Starlette
          - pattern: request.query_params[...]
          - pattern: request.path_params[...]
          # Generic
          - pattern: input(...)
          - pattern: os.environ[...]
          - pattern: os.environ.get(...)
          - pattern: sys.argv[...]
    pattern-sinks:
      # Module-level logging functions — focus on the message/format-string
      - patterns:
          - pattern: logging.info($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: logging.warning($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: logging.error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: logging.debug($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: logging.critical($MSG, ...)
          - focus-metavariable: $MSG
      # Logger instance methods
      - patterns:
          - pattern: $LOGGER.info($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.warning($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.debug($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.critical($MSG, ...)
          - focus-metavariable: $MSG
      # One placeholder and one value: raw formatting can forge records.
      # Encoded conversions are excluded; Go type errors also expose strings.
      - patterns:
          - pattern-either:
              - pattern: $LOGGER.info($FORMAT, $VALUE)
              - pattern: $LOGGER.warning($FORMAT, $VALUE)
              - pattern: $LOGGER.error($FORMAT, $VALUE)
              - pattern: $LOGGER.debug($FORMAT, $VALUE)
              - pattern: $LOGGER.critical($FORMAT, $VALUE)
              - pattern: $LOGGER.exception($FORMAT, $VALUE)
          - metavariable-regex:
              metavariable: $FORMAT
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\%\r\n]|%%)*%[s](?:[^"\\%\r\n]|%%)*"|'(?:[^'\\%\r\n]|%%)*%[s](?:[^'\\%\r\n]|%%)*')$
          - focus-metavariable: $VALUE
    # A sanitizer must handle BOTH \n and \r — a single-character
    # replace (or a "\r\n" pair replace) still lets the other bare
    # character forge entries.
    # Literal CR/LF value contracts, shared with header sanitization.
    # Guarded assignment results preserve safe locals on Semgrep 1.177.
    # Dynamic/encoded literals remain conservative; normalization is allowed
    # only when the outer operation removes the introduced control.
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER, -1)
              - pattern: $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER)
              - pattern: $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER, -1)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER, -1)
                      - pattern: $SAFE = $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER)
                      - pattern: $SAFE = $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER, -1)
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $INNER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"tr])*"|'(?:[^'\\\r\n]|\\[\\'tr])*')$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"t])*"|'(?:[^'\\\r\n]|\\[\\'t])*')$
          - metavariable-regex:
              metavariable: $FIRST
              constant-propagation: false
              regex: >-
                ^(?:"\\n"|'\\n')$
          - metavariable-regex:
              metavariable: $SECOND
              constant-propagation: false
              regex: >-
                ^(?:"\\r"|'\\r')$
        exact: true
      - patterns:
          - pattern-either:
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER, -1)
              - pattern: $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER)
              - pattern: $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER, -1)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER, -1)
                      - pattern: $SAFE = $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER)
                      - pattern: $SAFE = $X.replace($FIRST, $INNER, -1).replace($SECOND, $OUTER, -1)
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $INNER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"tn])*"|'(?:[^'\\\r\n]|\\[\\'tn])*')$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"t])*"|'(?:[^'\\\r\n]|\\[\\'t])*')$
          - metavariable-regex:
              metavariable: $FIRST
              constant-propagation: false
              regex: >-
                ^(?:"\\r"|'\\r')$
          - metavariable-regex:
              metavariable: $SECOND
              constant-propagation: false
              regex: >-
                ^(?:"\\n"|'\\n')$
        exact: true
    metadata:
      cwe: ["CWE-117"]
      owasp_top_10: ["A9:2021-Security Logging and Monitoring Failures"]
      tags: ["security", "injection", "log-injection", "taint"]

  # ---------------------------------------------------------------------------
  # Go — taint: net/http handler params → log format-string position
  # ---------------------------------------------------------------------------
  - id: raptor.injection.log-injection.taint.go
    message: >-
      Untrusted data flows into the log format string. An attacker can
      inject newlines to forge log entries. Sanitise newlines before
      logging, or use a handler that encodes message and field values.
    languages: [go]
    severity: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.URL.Query().Get(...)
          - pattern: $REQ.FormValue(...)
          - pattern: $REQ.PostFormValue(...)
          - pattern: $REQ.Header.Get(...)
          - pattern: $REQ.PathValue(...)
          # gin / echo — receiver-name anchored: a bare $CTX.Query(...)
          # source also matches the .Query()/.Param() methods of stores,
          # DB handles, and routers, tainting fully hardcoded data
          # (self-taint; same fix as raptor.injection.sql.taint.go).
          - patterns:
              - pattern-either:
                  - pattern: $CTX.Query(...)
                  - pattern: $CTX.Param(...)
                  - pattern: $CTX.PostForm(...)
                  - pattern: $CTX.QueryParam(...)
                  - pattern: $CTX.FormValue(...)
              - metavariable-regex:
                  metavariable: $CTX
                  regex: '(?i)^(c|ctx|context|ectx|gctx|cc)$'
          # environment
          - pattern: os.Getenv(...)
          - pattern: os.Args[...]
    pattern-sinks:
      # log.Printf — focus on format string
      - patterns:
          - pattern: log.Printf($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: log.Fatalf($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: log.Panicf($FMT, ...)
          - focus-metavariable: $FMT
      # log.Print/Println — message is the content
      - patterns:
          - pattern: log.Println($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: log.Print($MSG, ...)
          - focus-metavariable: $MSG
      # Print/Println serialize every argument without quoting strings.
      - patterns:
          - pattern-either:
              - pattern: log.Print(..., $VALUE, ...)
              - pattern: log.Println(..., $VALUE, ...)
              - pattern: $LOGGER.Print(..., $VALUE, ...)
              - pattern: $LOGGER.Println(..., $VALUE, ...)
          - focus-metavariable: $VALUE
      # Standard slog TextHandler/JSONHandler encode messages and fields.
      # Custom handlers are not inferred from the slog API name here.
      # Logger instance
      - patterns:
          - pattern: $LOGGER.Printf($FMT, ...)
          - focus-metavariable: $FMT
      - patterns:
          - pattern: $LOGGER.Println($MSG, ...)
          - focus-metavariable: $MSG
      # One placeholder and one value: raw formatting can forge records.
      # Encoded conversions are excluded; Go type errors also expose strings.
      - patterns:
          - pattern-either:
              - pattern: $LOGGER.Printf($FORMAT, $VALUE)
              - pattern: $LOGGER.Fatalf($FORMAT, $VALUE)
              - pattern: $LOGGER.Panicf($FORMAT, $VALUE)
          - metavariable-regex:
              metavariable: $FORMAT
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\%\r\n]|%%)*%(?![qxXT])[A-Za-z](?:[^"\\%\r\n]|%%)*")$
          - focus-metavariable: $VALUE
      # fmt reports unused string arguments verbatim in EXTRA diagnostics.
      - patterns:
          - pattern-either:
              - pattern: $LOGGER.Printf($FORMAT, $VALUE)
              - pattern: $LOGGER.Fatalf($FORMAT, $VALUE)
              - pattern: $LOGGER.Panicf($FORMAT, $VALUE)
          - metavariable-regex:
              metavariable: $FORMAT
              constant-propagation: false
              regex: >-
                ^"(?:[^"\\%\r\n]|%%)*"$
          - focus-metavariable: $VALUE
    # Both \n and \r must be handled — a single ReplaceAll leaves the
    # other character usable for forging.
    # Literal CR/LF value contracts, shared with header sanitization.
    # Guarded assignment results preserve safe locals on Semgrep 1.177.
    # Dynamic/encoded literals remain conservative; normalization is allowed
    # only when the outer operation removes the introduced control.
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: strings.ReplaceAll(strings.ReplaceAll($X, $FIRST, $INNER), $SECOND, $OUTER)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE := strings.ReplaceAll(strings.ReplaceAll($X, $FIRST, $INNER), $SECOND, $OUTER)
                      - pattern: $SAFE = strings.ReplaceAll(strings.ReplaceAll($X, $FIRST, $INNER), $SECOND, $OUTER)
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $INNER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"tr])*")$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"t])*")$
          - metavariable-regex:
              metavariable: $FIRST
              constant-propagation: false
              regex: >-
                ^(?:"\\n")$
          - metavariable-regex:
              metavariable: $SECOND
              constant-propagation: false
              regex: >-
                ^(?:"\\r")$
        exact: true
      - patterns:
          - pattern-either:
              - pattern: strings.ReplaceAll(strings.ReplaceAll($X, $FIRST, $INNER), $SECOND, $OUTER)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE := strings.ReplaceAll(strings.ReplaceAll($X, $FIRST, $INNER), $SECOND, $OUTER)
                      - pattern: $SAFE = strings.ReplaceAll(strings.ReplaceAll($X, $FIRST, $INNER), $SECOND, $OUTER)
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $INNER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"tn])*")$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"t])*")$
          - metavariable-regex:
              metavariable: $FIRST
              constant-propagation: false
              regex: >-
                ^(?:"\\r")$
          - metavariable-regex:
              metavariable: $SECOND
              constant-propagation: false
              regex: >-
                ^(?:"\\n")$
        exact: true
    metadata:
      cwe: ["CWE-117"]
      owasp_top_10: ["A9:2021-Security Logging and Monitoring Failures"]
      tags: ["security", "injection", "log-injection", "taint"]

  # ---------------------------------------------------------------------------
  # Java — taint: servlet/Spring params → Logger message position
  # ---------------------------------------------------------------------------
  - id: raptor.injection.log-injection.taint.java
    message: >-
      Untrusted data flows into the log message string. An attacker can
      inject CRLF sequences to forge log entries in plain-text output.
      Strip or encode CR/LF for the final output format. Parameterized
      messages alone do not escape newlines; verify the configured encoder.
    languages: [java]
    severity: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          # Servlet
          - pattern: (HttpServletRequest $REQ).getParameter(...)
          - pattern: (HttpServletRequest $REQ).getHeader(...)
          - pattern: (HttpServletRequest $REQ).getPathInfo()
          - pattern: (HttpServletRequest $REQ).getQueryString()
          - pattern: (HttpServletRequest $REQ).getRequestURI()
          # Spring MVC
          - pattern: (WebRequest $REQ).getParameter(...)
          - pattern: (WebRequest $REQ).getHeader(...)
    pattern-sinks:
      # SLF4J / Log4j2 Logger — focus on message position
      - patterns:
          - pattern: (Logger $LOG).info($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: (Logger $LOG).warn($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: (Logger $LOG).error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: (Logger $LOG).debug($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: (Logger $LOG).trace($MSG, ...)
          - focus-metavariable: $MSG
      # One placeholder and one value: raw formatting can forge records.
      # Encoded conversions are excluded; Go type errors also expose strings.
      - patterns:
          - pattern-either:
              - pattern: (Logger $LOG).info($FORMAT, $VALUE)
              - pattern: (Logger $LOG).warn($FORMAT, $VALUE)
              - pattern: (Logger $LOG).error($FORMAT, $VALUE)
              - pattern: (Logger $LOG).debug($FORMAT, $VALUE)
              - pattern: (Logger $LOG).trace($FORMAT, $VALUE)
          - metavariable-regex:
              metavariable: $FORMAT
              constant-propagation: false
              regex: >-
                ^(?:"[^"\\{}\r\n]*\{\}[^"\\{}\r\n]*")$
          - focus-metavariable: $VALUE
    # Both \n and \r must be handled — the regex-class replaceAll does,
    # single-character replaces only qualify chained in both orders.
    # Literal CR/LF value contracts, shared with header sanitization.
    # Guarded assignment results preserve safe locals on Semgrep 1.177.
    # Dynamic/encoded literals remain conservative; normalization is allowed
    # only when the outer operation removes the introduced control.
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER);
                      - pattern: String $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER);
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $INNER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"tr])*")$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"t])*")$
          - metavariable-regex:
              metavariable: $FIRST
              constant-propagation: false
              regex: >-
                ^(?:"\\n")$
          - metavariable-regex:
              metavariable: $SECOND
              constant-propagation: false
              regex: >-
                ^(?:"\\r")$
        exact: true
      - patterns:
          - pattern-either:
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER);
                      - pattern: String $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER);
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $INNER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"tn])*")$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n]|\\[\\"t])*")$
          - metavariable-regex:
              metavariable: $FIRST
              constant-propagation: false
              regex: >-
                ^(?:"\\r")$
          - metavariable-regex:
              metavariable: $SECOND
              constant-propagation: false
              regex: >-
                ^(?:"\\n")$
        exact: true
      - patterns:
          - pattern-either:
              - pattern: $X.replaceAll($SEARCH, $OUTER)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE = $X.replaceAll($SEARCH, $OUTER);
                      - pattern: String $SAFE = $X.replaceAll($SEARCH, $OUTER);
                  - metavariable-regex:
                      metavariable: $SAFE
                      regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $SEARCH
              constant-propagation: false
              regex: >-
                ^"\[(?:\\{1,2}r\\{1,2}n|\\{1,2}n\\{1,2}r)\]"$
          - metavariable-regex:
              metavariable: $OUTER
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\\r\n$]|\\[\\"t])*")$
        exact: true
    metadata:
      cwe: ["CWE-117"]
      owasp_top_10: ["A9:2021-Security Logging and Monitoring Failures"]
      tags: ["security", "injection", "log-injection", "taint"]

  # ---------------------------------------------------------------------------
  # JavaScript / TypeScript — taint: Express/Koa params → console/logger sinks
  # ---------------------------------------------------------------------------
  - id: raptor.injection.log-injection.taint.javascript
    message: >-
      Untrusted data flows into a log message. An attacker can inject
      newlines to forge log entries or corrupt log parsers. Sanitise
      newlines or use an encoder that escapes them in the final output.
    languages: [javascript, typescript]
    severity: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          # Express — receiver-name anchored: bare $REQ.query/.params/
          # .body/.headers sources match those field names on any local
          # object, tainting fully hardcoded data (self-taint).
          - patterns:
              - pattern-either:
                  - pattern: $REQ.query[...]
                  - pattern: $REQ.query.$PROP
                  - pattern: $REQ.params[...]
                  - pattern: $REQ.params.$PROP
                  - pattern: $REQ.body[...]
                  - pattern: $REQ.body.$PROP
                  - pattern: $REQ.headers[...]
              - metavariable-regex:
                  metavariable: $REQ
                  regex: '(?i)^(req|request)$'
          # Koa — receiver-name anchored (same self-taint shape as the
          # Express block above).
          - patterns:
              - pattern-either:
                  - pattern: $CTX.query[...]
                  - pattern: $CTX.query.$PROP
                  - pattern: $CTX.params[...]
                  - pattern: $CTX.params.$PROP
                  - pattern: $CTX.request.body[...]
              - metavariable-regex:
                  metavariable: $CTX
                  regex: '(?i)^(c|ctx|context)$'
          # Generic
          - pattern: process.env[...]
          - pattern: process.env.$PROP
          - pattern: process.argv[...]
    pattern-sinks:
      - patterns:
          - pattern: console.log($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: console.error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: console.warn($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: console.info($MSG, ...)
          - focus-metavariable: $MSG
      # Generic application loggers; verify the concrete output encoder.
      - patterns:
          - pattern: $LOGGER.info($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.warn($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.error($MSG, ...)
          - focus-metavariable: $MSG
      - patterns:
          - pattern: $LOGGER.debug($MSG, ...)
          - focus-metavariable: $MSG
      # One placeholder and one value: raw formatting can forge records.
      # Encoded conversions are excluded; Go type errors also expose strings.
      - patterns:
          - pattern-either:
              - pattern: console.log($FORMAT, $VALUE)
              - pattern: console.warn($FORMAT, $VALUE)
              - pattern: console.error($FORMAT, $VALUE)
              - pattern: console.info($FORMAT, $VALUE)
              - pattern: console.debug($FORMAT, $VALUE)
          - metavariable-regex:
              metavariable: $FORMAT
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\%\r\n]|%%)*%[s](?:[^"\\%\r\n]|%%)*"|'(?:[^'\\%\r\n]|%%)*%[s](?:[^'\\%\r\n]|%%)*')$
          - focus-metavariable: $VALUE
      # With no consuming directive, console appends string arguments raw.
      - patterns:
          - pattern-either:
              - pattern: console.log($FORMAT, $VALUE)
              - pattern: console.warn($FORMAT, $VALUE)
              - pattern: console.error($FORMAT, $VALUE)
              - pattern: console.info($FORMAT, $VALUE)
              - pattern: console.debug($FORMAT, $VALUE)
          - metavariable-regex:
              metavariable: $FORMAT
              constant-propagation: false
              regex: >-
                ^(?:"(?:[^"\\%\r\n]|%%)*"|'(?:[^'\\%\r\n]|%%)*')$
          - focus-metavariable: $VALUE
    # Both \n and \r must be handled — the character-class replace
    # does, single-character replaces only qualify chained in both
    # orders.
    # Literal CR/LF value contracts, shared with header sanitization.
    # Guarded assignment results preserve safe locals on Semgrep 1.177.
    # Dynamic/encoded literals remain conservative; normalization is allowed
    # only when the outer operation removes the introduced control.
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
              - patterns:
                  - pattern-either:
                      - pattern: $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
                      - pattern: const $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
                      - pattern: let $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
                      - pattern: var $SAFE = $X.replace($FIRST, $INNER).replace($SECOND, $OUTER)
