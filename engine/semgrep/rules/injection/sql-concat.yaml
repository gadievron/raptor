rules:
  - id: raptor.injection.sql.concatenation
    message: SQL query formed by string concatenation; consider parameterised queries or prepared statements.
    languages: [java, python, javascript, php]
    severity: HIGH
    pattern-either:
      - pattern: $OBJ.executeQuery("SELECT " + $X + " FROM " + $Y)
      - pattern: query = "SELECT " + ...
    metadata:
      cwe: ["CWE-89"]
      asvs: ["V5.1"]

  - id: raptor.injection.sql.taint.python
    message: Untrusted data flows into SQL execution. Use parameterised queries or placeholders.
    languages: [python]
    severity: CRITICAL
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET[$_]
          - pattern: request.POST[$_]
          - pattern: flask.request.args[$_]
          - pattern: flask.request.form[$_]
          - pattern: input(...)
          - pattern: os.environ[$_]
    pattern-sinks:
      - pattern-either:
          - pattern: $DB.execute($QUERY)
          - pattern: $DB.executemany($QUERY)
    # NOTE: sqlalchemy.text() and psycopg2.sql.SQL() are NOT
    # sanitizers — both wrap the string verbatim, so tainted data
    # concatenated into their argument still reaches the database
    # as executable SQL. Genuinely parameterised calls
    # (db.execute(query, params)) are already non-findings: the
    # one-argument sink patterns above do not match them.
    pattern-sanitizers:
      - pattern: int(...)
    metadata:
      cwe: ["CWE-89"]
