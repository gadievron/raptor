rules:
  # Concatenation shapes are language-split: the PHP `.` operator and
  # the Python `%` format don't parse under the other grammars, and a
  # single multi-language rule dies whole when one branch fails.
  # Known residual (documented, not detected here): f-strings /
  # template literals — those are the taint rules' job below.
  # Pre-fix this rule matched only the exact shape `query = "SELECT "
  # + $X` (variable literally named `query`, literal exactly
  # "SELECT ") — effectively dead on real code (U12-F102).
  - id: raptor.injection.sql.concatenation
    message: SQL query formed by string concatenation; use parameterised queries or prepared statements.
    languages: [java, javascript, python]
    severity: HIGH
    pattern-either:
      - pattern: $Q = "=~/(?i)^\s*(select|insert|update|delete|create|drop|alter)[^a-z0-9_]/" + ...
      - patterns:
          - pattern: $OBJ.$METHOD("=~/(?i)^\s*(select|insert|update|delete)[^a-z0-9_]/" + ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(executeQuery|executeUpdate|execute|executemany|query|rawQuery)$
    metadata:
      cwe: ["CWE-89"]
      asvs: ["V5.1"]

  - id: raptor.injection.sql.concatenation.format
    message: SQL query formed by %-formatting; use parameterised queries or placeholders.
    languages: [python]
    severity: HIGH
    pattern: $Q = "=~/(?i)^\s*(select|insert|update|delete)[^a-z0-9_]/" % ...
    metadata:
      cwe: ["CWE-89"]
      asvs: ["V5.1"]

  - id: raptor.injection.sql.concatenation.php
    message: SQL query formed by string concatenation; use parameterised queries or prepared statements.
    languages: [php]
    severity: HIGH
    # Deep match on the innermost `"SQL..." . $X` node so left-assoc
    # chains fire; a constant SQL string with no concatenation has no
    # `.` node and stays silent.
    pattern: $Q = <... "=~/(?i)^\s*(select|insert|update|delete)[^a-z0-9_]/" . $X ...>;
    metadata:
      cwe: ["CWE-89"]
      asvs: ["V5.1"]

  - id: raptor.injection.sql.taint.python
    message: Untrusted data flows into SQL execution. Use parameterised queries or placeholders.
    languages: [python]
    severity: CRITICAL
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET[$_]
          - pattern: request.GET.get(...)
          - pattern: request.GET.getlist(...)
          - pattern: request.POST[$_]
          - pattern: request.POST.get(...)
          - pattern: request.POST.getlist(...)
          - pattern: flask.request.args[$_]
          - pattern: flask.request.args.get($KEY)
          - pattern: flask.request.args.get($KEY, $DEFAULT)
          - pattern: flask.request.args.get($KEY, default=$DEFAULT)
          - pattern: flask.request.args.get(key=$KEY)
          - pattern: flask.request.args.get(key=$KEY, default=$DEFAULT)
          # Converted MultiDict lists need callback analysis; model only
          # unconverted single-key calls here.
          - pattern: flask.request.args.getlist($KEY)
          - pattern: flask.request.args.getlist(key=$KEY)
          - pattern: flask.request.form[$_]
          - pattern: flask.request.form.get($KEY)
          - pattern: flask.request.form.get($KEY, $DEFAULT)
          - pattern: flask.request.form.get($KEY, default=$DEFAULT)
          - pattern: flask.request.form.get(key=$KEY)
          - pattern: flask.request.form.get(key=$KEY, default=$DEFAULT)
          - pattern: flask.request.form.getlist($KEY)
          - pattern: flask.request.form.getlist(key=$KEY)
          - pattern: flask.request.values[$_]
          - pattern: flask.request.values.get($KEY)
          - pattern: flask.request.values.get($KEY, $DEFAULT)
          - pattern: flask.request.values.get($KEY, default=$DEFAULT)
          - pattern: flask.request.values.get(key=$KEY)
          - pattern: flask.request.values.get(key=$KEY, default=$DEFAULT)
          - pattern: flask.request.values.getlist($KEY)
          - pattern: flask.request.values.getlist(key=$KEY)
          - pattern: input(...)
          - pattern: os.environ[$_]
          - pattern: os.environ.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.execute($QUERY, ...)
              - pattern: $DB.executemany($QUERY, ...)
              - pattern: $DB.executescript($QUERY)
              - pattern: $DB.execute(query=$QUERY, ...)
              - pattern: $DB.executemany(query=$QUERY, ...)
              - pattern: $DB.execute(statement=$QUERY, ...)
          - focus-metavariable: $QUERY
    # Wrapping text with sqlalchemy.text() or psycopg2.sql.SQL() does not
    # escape it. Bound values are separate from SQL text: adding bind
    # arguments cannot make an already tainted statement safe.
    pattern-sanitizers:
      - pattern: int(...)
        exact: true
    metadata:
      cwe: ["CWE-89"]
