[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
BASH_DEFAULT_TIMEOUT_MS = "300000"
RAPTOR_ENV_FILE = ".codex/raptor.env"
RAPTOR_MAINTAIN_PROJECT_WORKING_DIR = "1"
CODEX = "1"
_RAPTOR_TRUSTED = "1"

# ── Hooks ─────────────────────────────────────────────────────────
# Defined inline rather than in hooks.json so they are discovered
# correctly when Codex runs from a git worktree (Codex resolves the
# JSON path via the git common directory, not the worktree root).

[[hooks.SessionStart]]
matcher = "startup"

[[hooks.SessionStart.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-session-init"

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-lifecycle-hook stop"
timeout = 5

# PostToolUse is deliberately NOT registered for Codex.  Codex fires
# PostToolUse on success AND failure (no PostToolUseFailure event) and
# sends tool_response as a string rather than tool_output.exit_code as
# an int — the lifecycle hook cannot distinguish success from failure
# and stamps a failure marker on every RAPTOR Bash call, flipping
# successful runs to Failed at the next Stop.  Claude Code's
# PostToolUseFailure (settings.json) is unaffected.

[[hooks.SessionEnd]]
matcher = ""

[[hooks.SessionEnd.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-lifecycle-hook session-end"
timeout = 1
