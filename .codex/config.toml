[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
BASH_DEFAULT_TIMEOUT_MS = "300000"
RAPTOR_ENV_FILE = ".codex/raptor.env"
RAPTOR_MAINTAIN_PROJECT_WORKING_DIR = "1"
CODEX = "1"
_RAPTOR_TRUSTED = "1"

# ── Hooks ─────────────────────────────────────────────────────────
# Defined inline rather than in hooks.json so they are discovered
# correctly when Codex runs from a git worktree (Codex resolves the
# JSON path via the git common directory, not the worktree root).

[[hooks.SessionStart]]
matcher = "startup"

[[hooks.SessionStart.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-session-init"

[[hooks.Stop]]
matcher = ""

[[hooks.Stop.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-lifecycle-hook codex-stop"
timeout = 5

# Codex does not expose the unified-exec exit code in PostToolUse.
# Record simple POSIX RAPTOR helper exits before consuming their results.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-lifecycle-hook codex-before"
timeout = 5

[[hooks.PostToolUse]]
matcher = "Bash"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-lifecycle-hook codex-after"
timeout = 5

[[hooks.SessionEnd]]
matcher = ""

[[hooks.SessionEnd.hooks]]
type = "command"
command = "_RAPTOR_TRUSTED=1 libexec/raptor-lifecycle-hook session-end"
timeout = 1
