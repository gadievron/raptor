name: Recover macOS runner allocation

on:
  workflow_run:
    workflows: ['Test Suite', 'Sandbox wrapper acceptance', 'Nightly (slow + integration)', 'CodeQL Advanced']
    types: [completed]

permissions: {}

concurrency:
  group: macos-runner-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      # workflow_run has write permissions: load ONLY the trusted default-branch
      # revision of this workflow, never workflow_run.head_sha or PR artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retry a confirmed unallocated macOS job once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/retry_macos_allocation.py --apply

  retry-limit:
    name: Explain automatic recovery limit
    if: >-
      github.event.workflow_run.run_attempt == 2 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Explain why another allocation retry was not requested
        shell: bash
        run: |
          {
            echo '### Automatic macOS recovery limit reached'
            echo
            echo 'The source workflow is already on attempt 2. Automatic allocation recovery is limited to one retry; no further retry was requested.'
            echo
            echo 'Inspect the source macOS job: an empty step list and no assigned runner indicate allocation failure. Executed setup or test failures need their own investigation.'
            echo
            echo 'A manual rerun remains available. Increasing a test timeout does not address runner allocation failures.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
