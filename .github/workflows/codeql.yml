# CodeQL Advanced — RAPTOR
#
# Restructured 2026-05-15 to eliminate the "1 configuration not found"
# meta-check race:
#
#   * Pre-fix: each matrix entry uploaded its own SARIF as soon as
#     analyze finished. The c-cpp / actions stubs landed in ~12s,
#     the python real analysis arrived ~60s later, and GitHub's
#     `CodeQL` (github-advanced-security app) meta-check evaluated
#     on first-upload arrival — well before python landed. Two of
#     three configs visible → "1 configuration not found".
#
#   * Post-fix: matrix entries write SARIF to disk only
#     (`upload: never`) and stash as artifacts. A barrier `upload`
#     job depends on the whole matrix, downloads all three
#     artifacts, merges them into a single multi-run SARIF
#     (each run keeps its own automationDetails.id = category),
#     and uploads via ONE `upload-sarif` call. GitHub processes
#     the multi-run file as a single atomic delivery, so the
#     meta-check fires with all three configs visible.
#
# Combining multi-run SARIFs with DIFFERENT categories is
# explicitly supported by github/codeql-action (the 2025-07-21
# changelog only deprecated combining runs with DUPLICATE
# categories — see codeql-action/src/upload-lib.ts:65-95).

name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  schedule:
    - cron: '34 2 * * 5'
  workflow_dispatch:

# Cancel superseded runs on the same PR. Pushes to main are NOT
# cancelled — every main commit must be fully analysed for the
# baseline. The conditional handles both correctly.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least-privilege at the workflow level. Individual jobs
# elevate as needed (e.g. ``upload`` needs ``security-events: write``
# to upload SARIF results).
permissions:
  contents: read

jobs:
  # Skip the analyze + upload jobs if a previous successful run already
  # covered this exact commit SHA. Exact-SHA arm ONLY — unlike
  # tests.yml, this workflow deliberately carries NO squash-merge
  # fallback: GitHub's default-branch code-scanning alert baseline
  # refreshes only from analyses uploaded for refs/heads/main, and the
  # PR run's upload targets the PR ref. Skipping the push-to-main run
  # because the PR head's (byte-identical) tree already passed starved
  # main's alert state — new alerts opening and fixed alerts closing —
  # until the weekly cron or the next direct push, contradicting the
  # concurrency comment above. A true re-run of the SAME commit stays
  # deduped: its earlier run already uploaded for this ref.
  pre_check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      should_skip: ${{ steps.dup.outputs.should_skip }}
    steps:
      - id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          should_skip=false
          if [[ "$EVENT" != "schedule" && "$EVENT" != "workflow_dispatch" \
             && "$EVENT" != "merge_group" ]]; then
            # 1. Exact-SHA match — covers fast-forward merges and
            #    explicit re-runs where the SHA is identical.
            dup=$(gh api -X GET "repos/${REPO}/actions/runs" \
                    -f "head_sha=${SHA}" -f "status=success" \
                    --jq ".workflow_runs[] | select(.name==\"${WORKFLOW}\" and .id != ${RUN_ID}) | .id" \
                  | head -n1 || true)
            if [[ -n "${dup:-}" ]]; then
              should_skip=true
              echo "Skipping: prior successful run ${dup} already covered SHA ${SHA}"
            fi
            # NO arm 2 here: the squash-merge fallback (see tests.yml)
            # must not gate this workflow — the push run's upload is
            # the ONLY delivery to main's code-scanning baseline (see
            # the pre_check heading comment).
          fi
          echo "should_skip=${should_skip}" >> "$GITHUB_OUTPUT"

  # Per-language path scoping — the analyze matrix gates each entry on
  # its corresponding filter so a python-only PR skips the c-cpp and
  # actions matrix entries, etc. Reuses tests.yml's compute_filters.py
  # for filter logic so both workflows stay in sync.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: pre_check
    if: needs.pre_check.outputs.should_skip != 'true'
    permissions:
      contents: read
    outputs:
      codeql_python: ${{ steps.filter.outputs.codeql_python }}
      codeql_cpp: ${{ steps.filter.outputs.codeql_cpp }}
      codeql_actions: ${{ steps.filter.outputs.codeql_actions }}
      force_full: ${{ steps.force.outputs.force_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: force
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" \
             || "$EVENT" == "merge_group" ]]; then
            echo "force_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_full=false" >> "$GITHUB_OUTPUT"
          fi
      - id: changed_files
        if: steps.force.outputs.force_full == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          out=/tmp/changed_files.txt
          : > "$out"
          # ``--jq`` expressions use ``?`` + ``// []`` to suppress jq's
          # ``cannot iterate over: null`` error on responses that are
          # an error object (non-array). No list → compute_filters
          # forces all filters true.
          case "$EVENT" in
            pull_request|pull_request_target)
              gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                --jq '(. // [])[]?.filename' >> "$out"
              ;;
            push)
              if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
                rm -f "$out"
              else
                # The compare API caps ``files`` at 300 entries and
                # silently returns the FIRST 300 for a bigger diff —
                # the key stays present, so the "no list" fail-open
                # path never fires on truncation and a truncated list
                # could drop the only file matching a language filter.
                # At the cap, discard the list → full scan.
                resp=/tmp/compare_response.json
                gh api --paginate \
                  "repos/${REPO}/compare/${BEFORE}...${AFTER}" > "$resp"
                # No previous_filename companion here (tests.yml emits
                # it): deliberate asymmetry — these lists feed
                # glob-shaped LANGUAGE filters, and a rename's old
                # path never changes which languages the new tree
                # contains.
                jq -r '(.files // [])[]?.filename' "$resp" >> "$out"
                files_n=$(wc -l < "$out")
                if (( files_n >= 300 )); then
                  echo "::notice::compare listed ${files_n} files — at the API's 300-file cap, list may be truncated; forcing full scan"
                  rm -f "$out"
                fi
              fi
              ;;
            *)
              rm -f "$out"
              ;;
          esac
          if [[ -f "$out" ]]; then
            echo "list=$out" >> "$GITHUB_OUTPUT"
          fi
      - id: filter
        env:
          CHANGED_FILES_LIST: ${{ steps.changed_files.outputs.list }}
        run: |
          python3 .github/scripts/compute_filters.py

  # Run analyses in parallel; SARIF stashed as artifacts. No upload
  # happens here — the barrier job below collects all three and
  # delivers them atomically.
  analyze:
    needs: [pre_check, changes]
    if: needs.pre_check.outputs.should_skip != 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      # security-events: write NOT needed here — only the upload job
      # publishes SARIFs. Analyse just produces them. But read IS
      # needed: the CodeQL Action queries the CodeQL API to fetch
      # prior analysis results (for diff-based analysis scoping +
      # metadata reporting). Without read, GitHub Actions emits the
      # "Resource not accessible by integration" warning and the
      # action falls back to full analysis. For fork PRs GitHub's
      # security model restricts the GITHUB_TOKEN regardless, so the
      # warning persists there — but for same-repo PRs the read grant
      # silences it cleanly.
      security-events: read
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Determine whether this matrix entry should run
        id: gate
        env:
          FORCE: ${{ needs.changes.outputs.force_full }}
          FILTER_PYTHON: ${{ needs.changes.outputs.codeql_python }}
          FILTER_CPP: ${{ needs.changes.outputs.codeql_cpp }}
          FILTER_ACTIONS: ${{ needs.changes.outputs.codeql_actions }}
          LANG: ${{ matrix.language }}
        run: |
          set -euo pipefail
          case "$LANG" in
            python)  flag="$FILTER_PYTHON" ;;
            c-cpp)   flag="$FILTER_CPP" ;;
            actions) flag="$FILTER_ACTIONS" ;;
            *)       flag="true" ;;
          esac
          if [[ "$FORCE" == "true" || "$flag" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CodeQL ${LANG} — no relevant changes"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Free disk space so CodeQL's overlay analysis can cache the
      # base database (~200-800MB). Without this, the runner's
      # default ~14GB free is insufficient and overlay silently
      # falls back to full extraction.
      - name: Free disk space for overlay analysis
        if: steps.gate.outputs.run == 'true' && matrix.language == 'python'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Initialize CodeQL
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Run manual build steps
        if: steps.gate.outputs.run == 'true' && matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode, replace this with the build commands.' >&2
          exit 1

      # ANALYSE only — do NOT upload from here. The barrier job
      # below uploads all three matrix outputs atomically.
      #
      # ``upload: never`` defers the SARIF upload to the barrier
      # job. ``upload-database: false`` separately disables the
      # CodeQL database upload (a distinct default that's true
      # on ``push`` events and silently tries to upload to
      # security-events: write, which this job lacks — produces
      # "Maximum retry attempts exhausted, aborting database
      # upload" + "Resource not accessible by integration" if
      # left default-on).
      - name: Perform CodeQL Analysis (no upload — deferred to barrier job)
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:${{matrix.language}}"
          upload: never
          upload-database: false
          output: ./sarif-out

      # When the per-language gate skipped this matrix entry (no
      # relevant changes), write an empty stub SARIF for the same
      # category so the merged multi-run upload below covers all
      # three configs and the meta-check sees a complete baseline
      # match.
      #
      # PR / merge_group ONLY: the stub exists for the meta-check
      # race on proposed refs. GitHub treats an upload for the same
      # (tool, category, ref) as a REPLACEMENT of the previous
      # analysis, so a zero-result stub uploaded for refs/heads/main
      # (e.g. a docs-only direct push, or a merge whose PR-head run
      # the dedup didn't find) would close that category's open
      # alerts as no-longer-detected until the next real analysis.
      # On push, gated-out languages upload nothing instead — their
      # existing main-branch analysis stays authoritative.
      - name: Write empty SARIF for skipped language
        if: >-
          steps.gate.outputs.run != 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          LANG_NAME: ${{ matrix.language }}
        run: |
          mkdir -p ./sarif-out
          python3 - <<'PY' > ./sarif-out/empty.sarif
          import json, os
          from datetime import datetime, timezone
          lang = os.environ["LANG_NAME"]
          # automationDetails.id MUST match the category convention
          # `/language:<lang>/` so the merged upload registers the
          # same category as a real analyze would have.
          run = {
              "tool": {
                  "driver": {
                      "name": "CodeQL",
                      "organization": "GitHub",
                      "notifications": [],
                      "rules": [],
                  }
              },
              "automationDetails": {
                  "id": f"/language:{lang}/",
              },
              "invocations": [{
                  "executionSuccessful": True,
                  "endTimeUtc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "toolExecutionNotifications": [],
              }],
              "artifacts": [],
              "results": [],
              "columnKind": "utf16CodeUnits",
              "properties": {
                  "raptor.skipped_language": lang,
                  "raptor.reason": "no relevant changes — gated out by compute_filters.py",
              },
          }
          doc = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [run],
          }
          print(json.dumps(doc))
          PY

      # Skipped when this entry produced no SARIF (gated-out language
      # on a push — see the stub step above): if-no-files-found: error
      # must keep guarding the paths that DO produce one.
      - name: Stash SARIF as artifact for atomic upload
        if: >-
          needs.pre_check.outputs.should_skip != 'true' &&
          (steps.gate.outputs.run == 'true' ||
           github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # was v7.0.1
        with:
          name: sarif-${{ matrix.language }}
          path: ./sarif-out/*.sarif
          if-no-files-found: error
          retention-days: 1

  # Atomic multi-run upload. Combines all three matrix-emitted SARIFs
  # into a single SARIF document and uploads in one POST so GitHub's
  # CodeQL meta-check sees all configs in one shot.
  upload:
    needs: [pre_check, changes, analyze]
    # Skip entirely when no matrix entry produced a SARIF: on push,
    # gated-out languages write no stub (see the stub step), so an
    # all-gated push (e.g. docs-only direct push) has nothing to
    # upload — and MUST upload nothing, or main's per-category alert
    # baselines would be replaced by empty analyses. PR / merge_group
    # always have all three (stubs fill the gaps); force_full events
    # analyse everything.
    if: >-
      needs.pre_check.outputs.should_skip != 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
       needs.changes.outputs.force_full == 'true' ||
       needs.changes.outputs.codeql_python == 'true' ||
       needs.changes.outputs.codeql_cpp == 'true' ||
       needs.changes.outputs.codeql_actions == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Required to upload SARIF results.
      security-events: write
      # Required by the codeql-action/upload-sarif action's internal
      # provenance / status checks.
      contents: read
      actions: read
      packages: read

    steps:
      - name: Checkout (needed by upload-sarif for repo metadata)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # download-artifact's JS client treats Azure intermediary 403s
      # as non-retryable, causing transient failures (~1-in-20 runs).
      # A second attempt after the implicit delay between steps is
      # enough for the intermediary to recover.
      - name: Download all SARIF artifacts
        id: dl
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./sarif-in
          pattern: sarif-*
        continue-on-error: true

      - name: Retry artifact download on transient failure
        if: steps.dl.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./sarif-in
          pattern: sarif-*

      - name: Combine into single multi-run SARIF
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > combined.sarif
          import json, glob, os, sys
          from datetime import datetime, timezone

          import re

          def _infer_category(artifact_path):
              """Synthesize automationDetails.id from the artifact dir name.

              Artifact dirs are ``sarif-in/sarif-<language>/...``, so the
              language is the second path component minus the ``sarif-``
              prefix.  Returns ``/language:<lang>/`` matching the format
              the action would have written."""
              m = re.match(r"sarif-in/sarif-([^/]+)/", artifact_path)
              return f"/language:{m.group(1)}/" if m else None

          # Diagnostic: list everything the download produced.
          all_files = sorted(glob.glob("sarif-in/**/*", recursive=True))
          print(
              f"::notice::sarif-in contents ({len(all_files)} files): "
              + ", ".join(all_files),
              file=sys.stderr,
          )

          sarif_paths = sorted(glob.glob("sarif-in/sarif-*/*.sarif"))
          if not sarif_paths:
              sarif_paths = sorted(
                  glob.glob("sarif-in/**/*.sarif", recursive=True),
              )
              if sarif_paths:
                  print(
                      "::notice::flat glob empty, recursive found: "
                      + ", ".join(sarif_paths),
                      file=sys.stderr,
                  )

          runs = []
          for path in sarif_paths:
              sz = os.path.getsize(path)
              with open(path) as f:
                  doc = json.load(f)
              n_runs = len(doc.get("runs", []))
              print(
                  f"::notice::SARIF {path} ({sz} bytes, {n_runs} runs)",
                  file=sys.stderr,
              )
              for run in doc.get("runs", []):
                  aid = run.get("automationDetails", {}).get("id")
                  if not aid:
                      aid = _infer_category(path)
                      if aid:
                          run.setdefault("automationDetails", {})["id"] = aid
                          print(
                              f"::notice::Injected automationDetails.id "
                              f"'{aid}' into run from {path}",
                              file=sys.stderr,
                          )
                      else:
                          print(
                              f"::warning::SARIF run from {path} missing "
                              f"automationDetails.id and cannot infer — "
                              f"skipping",
                              file=sys.stderr,
                          )
                          continue
                  runs.append(run)

          if not runs:
              print("::error::No valid SARIF runs to upload", file=sys.stderr)
              print(
                  f"::error::Matched {len(sarif_paths)} SARIF file(s); "
                  f"check notices above for per-file run counts",
                  file=sys.stderr,
              )
              sys.exit(1)

          out = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": runs,
          }
          print(json.dumps(out))
          PY
          echo "Combined $(jq '.runs | length' combined.sarif) runs:"
          jq -r '.runs[] | "  - \(.automationDetails.id)  results=\(.results | length)"' combined.sarif

      # Stamp suppressions on triaged FP flow classes (sandbox audit-
      # log + denial-marker sinks). Source-side defences
      # (paths-ignore for tests + path-typed variable renames) handle
      # the bulk; this script is the defence-in-depth for residual
      # results where the sink is in production code. Each entry in
      # the script's KNOWN_FP_RULES table is reviewed in its own PR.
      - name: Apply known-FP suppressions
        run: |
          python3 .github/scripts/sarif_known_fp_suppressions.py combined.sarif

      # Single upload, atomic delivery. The action sends one POST to
      # `/code-scanning/sarifs` containing all runs; GitHub processes
      # the multi-run file as one batch and the meta-check fires with
      # all three configs visible.
      - name: Upload combined SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: combined.sarif
          # No `category:` here — each run carries its own
          # automationDetails.id which the action honours.
