name: Refresh Public Suffix List

on:
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'core/domains/**'
      - '.github/scripts/refresh_public_suffix_list.py'
      - '.github/workflows/refresh-public-suffix-list.yml'

permissions:
  contents: read

concurrency:
  group: public-suffix-list-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'gadievron/raptor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned test runner
        run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q core/domains/tests

  refresh:
    if: github.repository == 'gadievron/raptor' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned test runner
        run: python -m pip install pytest==9.1.1
      - name: Download and validate list
        run: python .github/scripts/refresh_public_suffix_list.py
      - name: Test refreshed boundaries
        run: python -m pytest -q core/domains/tests
      - name: Open or update refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- core/domains/data/public_suffix_list.dat; then
            exit 0
          fi
          branch=auto/public-suffix-list-refresh
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add core/domains/data/public_suffix_list.dat
          git commit -m 'chore(security): refresh Public Suffix List'
          git push --force origin "HEAD:refs/heads/$branch"
          if [ "$(gh pr list --repo "$REPO" --head "$branch" --json number --jq length)" = 0 ]; then
            gh pr create --repo "$REPO" --head "$branch" \
              --title 'chore(security): refresh Public Suffix List' \
              --body 'Updates the bundled Mozilla Public Suffix List, including private hosting suffixes. Boundary regression tests passed against the refreshed list. Review suffix changes before merging.'
          fi
