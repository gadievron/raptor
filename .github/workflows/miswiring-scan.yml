name: Miswiring scan (daily)

# Daily dead-code / miswiring sweep — the signal for the bug class
# where a wrong call or import is silently swallowed by a broad
# exception handler and a feature dies without a test failing.
#
# Runs .github/scripts/check_miswiring.py (stdlib-only, no deps)
# against the checked-in baseline. A NEW finding fails the job: fix
# the miswiring, or — deliberately, with a note — add its key to
# .github/scripts/miswiring_baseline.json. Baseline entries that no
# longer fire are warned as stale in the job log.
#
# These detectors ALSO gate PRs: lint.yml's ``repo-invariants`` job
# retains the same detectors for pull_request / push-to-main / merge_group;
# its env-docs step alone can skip proven-irrelevant changes. This daily
# sweep remains unconditional. Schedule-only coverage let a new finding
# merge green and fail here the next morning — delayed and
# misattributed. The daily sweep stays as belt-and-braces (catches
# baseline drift that lands outside the gated paths) and as the
# triage surface where stale-baseline warnings get read on a calm
# cadence rather than in a PR's merge path. The two detector sets are
# parity-pinned by test_ci_controls_docs: every repo-invariants step
# gets a step here, so the sets cannot drift apart again (this sweep
# ran five of lint's seven for two detector generations).

on:
  schedule:
    # 05:30 UTC — clear of tests.yml's full-suite cron (Mon/Thu
    # 06:00) and nightly.yml (07:00).
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

# Three groups share checkout and Python setup. Their detector times were
# approximately 69s / 55s / 51s in run 41836034045, so consolidation avoids
# seven runner allocations without making the short checks a long serial tail.
# Each detector remains a separate failing step; later detectors still run
# after an earlier detector fails, provided setup succeeded and no cancellation
# was requested.

jobs:
  env-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run env-var documentation drift check
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_env_docs.py

  source-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run miswiring detector against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          python3 .github/scripts/check_miswiring.py

      - name: Run canonical-JSON guardrail against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_canonical_json.py

      - name: Run run-dir read census against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_run_dir_reads.py

  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run vocabulary-list guardrail against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_vocab_lists.py

      - name: Run optional-dep import lint against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_optional_dep_imports.py

      - name: Run report-writer closure gate against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_report_writer_closure.py

      - name: Run console-chokepoint closure gate
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_console_chokepoint.py

      - name: Run workflow pipefail lint against baseline
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_workflow_pipefail.py

      - name: Run tracked-file census over the rule-pack subsystems
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 .github/scripts/check_tracked_file_census.py --require-git
