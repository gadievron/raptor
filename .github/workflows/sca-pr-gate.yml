name: SCA PR gate

# Runs raptor-sca against the PR merge result AND its base tree, then diffs
# the two findings.json sets. Fails the build when the PR introduces a new
# vulnerability at the configured severity threshold (default: high).
#
# Posts a markdown delta comment on the PR — operators see exactly
# which CVEs / hygiene rules fired or resolved between the two
# branches without having to read raw scan output.
#
# Tuned for SCA-relevant changes: only fires when the PR touches a
# manifest / lockfile / Dockerfile. Skip the workflow on docs-only
# PRs without burning CI minutes.

on:
  pull_request:
    paths:
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/Pipfile'
      - '**/Pipfile.lock'
      - '**/poetry.lock'
      - '**/uv.lock'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/pnpm-workspace.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Gemfile'
      - '**/Gemfile.lock'
      - '**/composer.json'
      - '**/composer.lock'
      - '**/*.csproj'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/pom.xml'
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/gradle.lockfile'
      - '**/settings.gradle*'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/Containerfile'
      - '**/*.Dockerfile'
      - '**/*.dockerfile'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '**/compose.yml'
      - '**/compose.yaml'
      - '**/compose.*.yml'
      - '**/compose.*.yaml'
      - '**/.pre-commit-config.yaml'
      - '.github/workflows/*.y*ml'
      - '**/action.yml'
      - '**/action.yaml'
      - '.gitlab-ci.yml'
      - '.gitlab-ci.yaml'
      - '.github/workflows/sca-pr-gate.yml'
      - 'uv.toml'
      - '.github/scripts/ci_cache_key.py'

permissions:
  contents: read
  pull-requests: write    # to post the diff comment

concurrency:
  group: sca-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VENV_PATH: .venv

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Belt-and-braces: no step in this job needs git credentials.
          persist-credentials: false
          # The merge result and its parents are sufficient for both scans.
          fetch-depth: 2
          # Default pull_request checkout = the PR merged into the
          # current base — the tree this gate actually judges. An
          # exact head.sha checkout breaks on PRs based on an older
          # main: the scan runs main's workflow against a tree that
          # may predate the tooling it invokes (bin/raptor-sca), and
          # the diff would blame the PR for baseline drift it never
          # introduced.

      - name: Enable the netns egress tier (unprivileged user namespaces)
        # The SCA resolvers dry-run untrusted manifests with egress
        # confined to the sandbox's netns tier, and the sandbox fails
        # closed when that tier is unavailable (require_proxy_netns —
        # the port-scoped Landlock fallback cannot enforce the hostname
        # allowlist). Ubuntu 24.04 runner images block unprivileged
        # user namespaces via AppArmor by default and the tier needs
        # newuidmap/newgidmap from the uidmap package.
        uses: ./.github/actions/enable-userns

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Restore or rebuild runtime venv
        uses: ./.github/actions/setup-venv
        with:
          cache-key-prefix: venv-runtime
          uv-export-extra-args: --no-dev
          save-on-rebuild: 'true'

      - name: Expose runtime interpreter to subsequent steps
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(Path(os.environ["VENV_PATH"]).resolve() / "bin") + "\n")
          PYTHON

      - name: Scan PR merge result
        run: bin/raptor-sca . --out /tmp/sca-pr --no-image-scanning

      - name: Scan PR base tree
        # The merge result's first parent is the exact base tree it includes.
        # Fetching a moving branch here compares different snapshots when the
        # base advances in the queue, and hardcoding main breaks other bases.
        shell: bash
        run: |
          # Refuse an unexpected head-only checkout instead of silently
          # treating the PR's previous commit as its comparison baseline.
          git rev-parse --verify 'HEAD^2^{commit}' >/dev/null
          baseline_commit=$(git rev-parse --verify 'HEAD^1^{commit}')
          baseline_root=$(mktemp -d "$RUNNER_TEMP/sca-baseline.XXXXXX")
          baseline_tree="$baseline_root/tree"
          cleanup_baseline() {
            git worktree remove --force "$baseline_tree" || true
            rm -rf -- "$baseline_root"
          }
          trap cleanup_baseline EXIT
          git worktree add --detach "$baseline_tree" "$baseline_commit"
          bin/raptor-sca "$baseline_tree" --out /tmp/sca-base --no-image-scanning

      - name: Compute diff
        id: diff
        # ``set +e`` so the diff command's non-zero exit (regression
        # found) doesn't abort this step — we capture the exit code,
        # post the comment, and only THEN fail if regressions exist.
        run: |
          set +e
          bin/raptor-sca diff \
            /tmp/sca-base/findings.json \
            /tmp/sca-pr/findings.json \
            --fail-on-severity high \
            --out /tmp/sca-diff.md
          DIFF_EXIT=$?
          echo "exit=$DIFF_EXIT" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/sca-diff.md ]; then
            # Mirror into the step summary (visible on the run page)
            cat /tmp/sca-diff.md >> "$GITHUB_STEP_SUMMARY"
            # Also print to the log so the findings are visible
            # inline when scrolling through CI output — especially
            # important for fork PRs where the PR comment can't be
            # posted.
            echo "──── SCA diff ────"
            cat /tmp/sca-diff.md
            echo "──── end SCA diff ────"
          fi

      - name: Post PR comment
        id: comment
        # Non-fatal: PRs from forks get a read-only GITHUB_TOKEN
        # regardless of the workflow's ``permissions:`` block (the
        # org-level "Workflow permissions" policy gates write tokens
        # to same-repo PRs). When the comment-post fails we log a
        # warning and continue — the diff is still surfaced via
        # GITHUB_STEP_SUMMARY (above), log output, and the regression
        # gate (below) still fails on high-severity additions.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Idempotent: ``gh pr comment --create-if-none`` would be
        # ideal but isn't a flag; the conventional shape is ``gh pr
        # comment --edit-last`` to update the most recent comment
        # rather than spam new ones on every push. We use a marker
        # in the body so subsequent runs find + edit OUR comment
        # rather than touching reviewers'.
        run: |
          set -euo pipefail
          comment_dir=$(mktemp -d "$RUNNER_TEMP/sca-comment.XXXXXX")
          trap 'rm -rf -- "$comment_dir"' EXIT
          {
            printf '%s\n\n' '<!-- raptor-sca-pr-gate -->'
            cat /tmp/sca-diff.md
          } > "$comment_dir/body.md"
          # Read all pages and edit only a comment posted by this workflow's bot.
          EXISTING=$(gh api --paginate --slurp \
            "/repos/${REPO}/issues/${PR}/comments?per_page=100" \
            --jq '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- raptor-sca-pr-gate -->")))] | first | .id // empty') || {
              echo "::warning::sca-pr-gate: could not list PR comments (likely a fork PR with restricted GITHUB_TOKEN); skipping comment post. Diff is in the step summary."
              echo "posted=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH \
              "/repos/${REPO}/issues/comments/$EXISTING" \
              -F "body=@$comment_dir/body.md" || {
                echo "::warning::sca-pr-gate: PATCH on existing comment failed; skipping. Diff is in the step summary."
                echo "posted=false" >> "$GITHUB_OUTPUT"
                exit 0
              }
          else
            gh pr comment "$PR" --body-file "$comment_dir/body.md" || {
              echo "::warning::sca-pr-gate: gh pr comment failed (likely a fork PR with restricted GITHUB_TOKEN); skipping. Diff is in the step summary."
              echo "posted=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          echo "posted=true" >> "$GITHUB_OUTPUT"


      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sca-pr-gate-${{ github.event.pull_request.number }}
          path: |
            /tmp/sca-pr/debug.log
            /tmp/sca-base/debug.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail on high-severity regressions
        if: steps.diff.outputs.exit != '0'
        run: |
          if [ "${{ steps.comment.outputs.posted }}" = "true" ]; then
            echo "::error::SCA diff reports new high-severity findings — see PR comment for details."
          else
            echo "::error::SCA diff reports new high-severity findings — see 'Compute diff' log output above or the step summary on the run page."
            echo ""
            echo "Findings summary:"
            cat /tmp/sca-diff.md
          fi
          exit 1
