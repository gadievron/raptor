name: CI deps image

# Builds + pushes the CI dependency image (.github/docker/ci-deps.Dockerfile)
# to GHCR. The Python unit-test tiers in tests.yml will run inside this
# image instead of each rebuilding + downloading the venv artifact — the
# fan-out that queues under a concurrent-runner cap.
#
# Tags pushed:
#   :main        — moving tag the test tiers pull. Updated on every build.
#   :req-<hash>  — content tag (first 12 hex of sha256 over requirements*.txt)
#                  for traceability + rollback.
#
# Uses the plain `docker` CLI (preinstalled on ubuntu runners) rather than
# docker/* marketplace actions, to keep the third-party action surface to
# just actions/checkout and actions/delete-package-versions (both pinned
# to the same SHAs the rest of the repo uses).

on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/docker/ci-deps.Dockerfile'
      - '.github/workflows/ci-deps-image.yml'
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Wed 03:00 UTC) so the base image picks up Debian
    # security patches even when requirements don't change. Off-peak vs
    # the Mon/Thu test crons and the nightly tier.
    - cron: '0 3 * * 3'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # actions/delete-package-versions@v5.0.0 (the GHCR pruning step) still
  # declares ``runs.using: node20`` and upstream has published no Node 24
  # release yet, so without this opt-in the runner emits a Node 20
  # deprecation warning for that step. Every other JS action pinned in
  # this repo already declares node24. Lift this once
  # actions/delete-package-versions ships a Node 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        # GHA expressions via env:, never interpolated into the script
        # body — the canonical hardening pattern this repo documents in
        # refit-sca-calibration.yml (and it keeps the token out of the
        # shell source text).
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" \
            | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Lowercase the owner — GHCR repository paths must be lowercase
          # and the repository_owner context can carry mixed case.
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/raptor-ci-deps"
          # Content tag over the manifests that define the image.
          reqhash="$(cat requirements.txt requirements-dev.txt | sha256sum | cut -c1-12)"
          docker build \
            -f .github/docker/ci-deps.Dockerfile \
            -t "${image}:main" \
            -t "${image}:req-${reqhash}" \
            .
          docker push "${image}:main"
          docker push "${image}:req-${reqhash}"
          echo "Pushed ${image}:main and ${image}:req-${reqhash}"

      # Prune the untagged digests left behind when :main / :req-<hash> move
      # to this build. Tagged versions (current :main + every :req-<hash>
      # rollback anchor) are untouched. GHCR has no auto-retention, so without
      # this the weekly rebuild alone accrues ~52 dangling versions/year.
      # delete-only-untagged + a small floor never risks a rollback anchor.
      - name: Prune superseded (untagged) image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # was v5.0.0
        with:
          package-name: raptor-ci-deps
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5

      # Tagged-anchor retention: keep the newest 10 tagged versions.
      # Bounded both ways deliberately (churn-prone limit): pruning an
      # old anchor costs only a rebuild-on-rollback — every :req-<hash>
      # is reproducible from its git-pinned requirements — while
      # unbounded anchors cost storage, package-page noise, and an
      # operator reasonably reading the ever-growing pile as broken
      # cleanup (this package reached 28 tagged versions that way,
      # so the first run shrinks 28 -> 10). 10 ≈ months of
      # requirements churn of rollback headroom. Scripted via the REST
      # API because delete-package-versions cannot express "newest N
      # TAGGED + always keep the moving tag" (its keep-count mixes
      # tagged and untagged): tagged versions are sorted newest-first
      # by created_at explicitly, the plan is logged before any
      # deletion, and any version carrying the moving :main tag is
      # skipped belt-and-braces even though it is always among the
      # newest.
      - name: Prune old tagged anchors (keep newest 10)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PKG: raptor-ci-deps
          MOVING: main
          KEEP: "10"
        run: |
          set -euo pipefail
          base="orgs/${OWNER}/packages/container/${PKG}"
          gh api "${base}" >/dev/null 2>&1 \
            || base="users/${OWNER}/packages/container/${PKG}"
          gh api --paginate "${base}/versions?per_page=100" \
            --jq '.[] | [(.id|tostring), .created_at, (.metadata.container.tags | join(","))] | @tsv' \
            > /tmp/versions.tsv \
            || { echo "::error::could not enumerate ${PKG} versions for tagged-anchor retention — inspect the package manually."; exit 1; }
          awk -F'\t' '$3 != ""' /tmp/versions.tsv | sort -t$'\t' -k2,2r > /tmp/tagged.tsv
          total="$(wc -l < /tmp/tagged.tsv)"
          echo "== tagged versions: ${total}; keeping the newest ${KEEP} (any '${MOVING}' carrier always kept)"
          tail -n +"$((KEEP + 1))" /tmp/tagged.tsv > /tmp/prune.tsv
          if [ ! -s /tmp/prune.tsv ]; then
            echo "== nothing to prune"
            exit 0
          fi
          echo "== retention plan (logged before any deletion):"
          while IFS=$'\t' read -r id created tags; do
            case ",${tags}," in
              *",${MOVING},"*) echo "   keep    ${id}  ${created}  ${tags}  (carries the moving tag)" ;;
              *)               echo "   delete  ${id}  ${created}  ${tags}" ;;
            esac
          done < /tmp/prune.tsv
          while IFS=$'\t' read -r id created tags; do
            case ",${tags}," in *",${MOVING},"*) continue ;; esac
            gh api -X DELETE "${base}/versions/${id}" \
              || { echo "::error::failed to delete tagged version ${id} of ${PKG} — token grant or a GHCR refusal; prune manually in the package settings."; exit 1; }
            echo "== deleted ${id} (${tags})"
          done < /tmp/prune.tsv
