name: Nightly (slow + integration)

# The `slow` and `integration` markers are deselected by default in
# pytest.ini (`addopts = -m "not integration and not slow"`), so these
# tests run NOWHERE in the per-PR / per-push test matrix. This workflow
# is the only place they execute in CI.
#
#   * slow        — perf baselines + sandbox-setup-heavy resolver tests
#                   (deterministic; a failure is a real regression).
#   * integration — live-network contract tests against OSV / NVD /
#                    GitHub (may flake on external outages; failures
#                    red-fail the run so they are investigated).
#
# The corpus-scale binary-oracle precision drivers carry their own
# `corpus` marker and run in weekly_corpus.yml, NOT here — they
# re-derive measurement numbers rather than pin regressions, and at
# minutes-per-driver they were the bulk of this job's wallclock. The
# synthetic driver stays `slow` as the nightly harness smoke.
#
# Deliberately a standalone workflow, NOT a job in tests.yml: it must
# never ride tests.yml's `merge_group` force_full path — the merge queue
# must not block on a live-API hiccup or a multi-minute perf baseline.

on:
  schedule:
    # 07:00 UTC — on the days tests.yml's full-suite cron also fires
    # (Mon/Thu 06:00) this stays an hour clear of it; every other day
    # it runs alone.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  VENV_PATH: .venv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  slow-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        # Ubuntu 24.04 runners block unprivileged user namespaces via
        # AppArmor by default; the sandbox's mount-ns backend needs them
        # (plus newuidmap/newgidmap from uidmap). Without this, the
        # untrusted-run fresh-procfs contract correctly refuses the
        # host-procfs-visible fallback and every untrusted-target test
        # fails at setup.
        run: |
          sudo apt-get install -y --no-install-recommends uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create venv and install deps
        # The default dev group includes every grammar; the tools group
        # adds Semgrep for the slow sweep-to-report integration tests.
        run: uv sync --locked --group tools

      - name: Install binary-analysis toolchain (radare2 + LLVM 21)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y --no-install-recommends llvm-21 clang-21
          sudo update-alternatives --install /usr/bin/clang clang \
            /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ \
            /usr/bin/clang++-21 100
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          r2 -v || true
          clang --version || true
          /usr/lib/llvm-21/bin/llvm-cov --version || true
          /usr/lib/llvm-21/bin/llvm-profdata --version || true

      # RAPTOR_MAX_SESSION_SECONDS: tier wallclock tripwire (root
      # conftest) — flags the session with a named summary when the
      # slow tier exceeds its budget, instead of drifting silently
      # toward the job timeout. Baseline at the time this was set:
      # ~10-15 min on ubuntu-latest with the corpus-scale drivers in
      # their own weekly tier; the budget carries the remaining
      # headroom to the 45-min job timeout's slow-step share. If it
      # fires without a starved runner, re-measure and either fix the
      # drift or consciously raise the budget with the new baseline.
      - name: Run slow tests
        env:
          RAPTOR_RANDOMISE_TESTS: ${{ github.run_id }}
          RAPTOR_MAX_SESSION_SECONDS: '1800'
        run: |
          source $VENV_PATH/bin/activate
          # .github test dirs included for their slow-marked
          # whole-repo import-graph classes (excluded from ci-lint's
          # bounded PR job by the default addopts marker filter).
          python -m pytest -m slow core packages .github/tests .github/scripts/tests -q --durations=25

      - name: Run integration tests (retry once on external outage)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source $VENV_PATH/bin/activate
          rc=0
          python -m pytest -m integration core packages --durations=25 \
            --tb=short --junitxml="$RUNNER_TEMP/integration-attempt-1.xml" \
            || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo ""
          echo "::warning::Integration tests failed (exit $rc) — retrying in 60s"
          echo ""
          sleep 60
          python -m pytest -m integration core packages --durations=25 \
            --tb=short --junitxml="$RUNNER_TEMP/integration-attempt-2.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: nightly-slow-integration-results
          path: ${{ runner.temp }}/integration-attempt-*.xml
          retention-days: 14
          if-no-files-found: ignore
