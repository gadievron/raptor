name: Nightly (slow + integration)

# The `slow` and `integration` markers are deselected by default in
# pytest.ini (`addopts = -m "not integration and not slow"`), so most
# of these tests run NOWHERE in the per-PR / per-push test matrix and
# this workflow is their only CI execution. One carve-out: the
# core/sandbox + packages/exploit_feasibility slow/integration subset
# ALSO runs in tests.yml on gated PRs — the sandbox job carries the
# combined tier, the exploit-feasibility job a package-scoped mirror
# for PRs that fire only its own filter (a sandbox regression once sat
# in this nightly-only window for days) — this workflow remains the
# full-repo, unfiltered pass over both markers.
#
#   * slow        — perf baselines + sandbox-setup-heavy resolver tests
#                   (deterministic; a failure is a real regression).
#   * integration — live-network contract tests against OSV / NVD /
#                    GitHub (may flake on external outages; failures
#                    red-fail the run so they are investigated).
#
# The corpus-scale binary-oracle precision drivers carry their own
# `corpus` marker and run in weekly_corpus.yml, NOT here — they
# re-derive measurement numbers rather than pin regressions, and at
# minutes-per-driver they were the bulk of this job's wallclock. The
# synthetic driver stays `slow` as the nightly harness smoke.
#
# Deliberately a standalone workflow, NOT a job in tests.yml: it must
# never ride tests.yml's `merge_group` force_full path — the merge queue
# must not block on a live-API hiccup or a multi-minute perf baseline.

on:
  schedule:
    # 07:00 UTC — on the days tests.yml's full-suite cron also fires
    # (Mon/Thu 06:00) this stays an hour clear of it; every other day
    # it runs alone.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suites to run (focused modes skip the full slow/integration batch)
        type: choice
        default: full
        options:
          - full
          - semgrep
          - java-log
          - scan-and-java-log

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  VENV_PATH: .venv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  slow-integration:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        # Ubuntu 24.04 runners block unprivileged user namespaces via
        # AppArmor by default; the sandbox's mount-ns backend needs them
        # (plus newuidmap/newgidmap from uidmap). Without this, the
        # untrusted-run fresh-procfs contract correctly refuses the
        # host-procfs-visible fallback and every untrusted-target test
        # fails at setup.
        uses: ./.github/actions/enable-userns

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Grammars-flavoured venv (dev deps + grammar wheels, an
      # optional-dependency group in pyproject.toml, locked in uv.lock)
      # under its own cache-key prefix so a prefix-match restore never
      # hands this job the plain venv that lacks the grammar wheels.
      # save-on-rebuild: no other job saves this flavour, so the
      # rebuild cost is paid once per uv.lock change instead of nightly.
      - name: Restore or rebuild venv (with grammars)
        uses: ./.github/actions/setup-venv
        with:
          cache-key-prefix: venv-grammars
          uv-export-extra-args: --extra grammars
          save-on-rebuild: 'true'

      - name: Install semgrep
        # semgrep is deliberately NOT a pyproject.toml dep (optional
        # tool, same as radare2/LLVM below), but the audit-pipeline
        # slow tests exercise real sweeps: G2's receipt gate demands
        # an EXECUTED confirmed sweep, so without the binary those
        # tests can only skip. Installed here so the nightly keeps
        # covering the sweep → record → report → feedback chain.
        run: uv tool install semgrep==1.177.0

      # The toolchain .debs are cached so the warm path installs from
      # local files instead of round-tripping apt.llvm.org every night
      # (the install step's most outage-prone leg). The key carries no
      # package-version component — a cached LLVM 21.x point release is
      # fine for these test families; bump the -v1 suffix to force a
      # refresh.
      - name: Restore apt toolchain cache (radare2 + LLVM 21 .debs)
        id: apt-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-llvm21-radare2-v1

      - name: Install binary-analysis toolchain (radare2 + LLVM 21)
        # continue-on-error so a transient apt/LLVM mirror outage doesn't
        # abort the whole nightly before the (toolchain-independent) test
        # families run; the "Refuse a toolchain-less..." step below still
        # reddens the RUN afterwards so the outage can't silently convert
        # the r2/llvm families into permanent skips (same rationale as
        # weekly_corpus.yml's all-skipped guard).
        id: toolchain
        continue-on-error: true
        env:
          DEBS_DIR: ${{ runner.temp }}/apt-debs
        run: |
          set -euo pipefail
          if ls "$DEBS_DIR"/*.deb >/dev/null 2>&1; then
            # Warm path: install straight from the cached .debs — no
            # network. dpkg resolves inter-deb ordering itself; a
            # dependency that left the runner image since the cache
            # was cut is mopped up from the network by ``apt-get -f``,
            # and the refuse step below still guards the end state.
            sudo dpkg -i "$DEBS_DIR"/*.deb \
              || sudo apt-get install -f -y --no-install-recommends
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends radare2
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 21
            sudo apt-get install -y --no-install-recommends llvm-21 clang-21
            # Capture this run's full apt transaction closure as .debs
            # for the cache: on a fresh runner the history log holds
            # only this job's installs, and --reinstall --download-only
            # fetches exactly those packages (dependencies included)
            # without touching the installed state.
            sudo mkdir -p "$DEBS_DIR"
            # Entries in the log line look like ``name:arch (version,
            # automatic)`` — match on the ``name:arch (`` shape so the
            # comma inside the parens can't leak stray tokens.
            pkgs=$(sed -n 's/^Install: //p' /var/log/apt/history.log \
                     | grep -oE '[A-Za-z0-9][A-Za-z0-9.+-]*:[a-z0-9-]+ \(' \
                     | sed 's/:.*//' | sort -u)
            [ -n "$pkgs" ]
            sudo apt-get install -y --reinstall --download-only \
              -o Dir::Cache::archives="$DEBS_DIR" $pkgs
            sudo find "$DEBS_DIR" -mindepth 1 ! -name '*.deb' -depth -delete
            sudo chown -R "$(id -u):$(id -g)" "$DEBS_DIR"
          fi
          sudo update-alternatives --install /usr/bin/clang clang \
            /usr/bin/clang-21 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ \
            /usr/bin/clang++-21 100
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          r2 -v || true
          clang --version || true
          /usr/lib/llvm-21/bin/llvm-cov --version || true
          /usr/lib/llvm-21/bin/llvm-profdata --version || true

      # Explicit save (not actions/cache's implicit post-job save) so a
      # partial download from a failed cold path can never be cached:
      # only a fully successful install step banks its .debs.
      - name: Save apt toolchain cache
        # continue-on-error: a transient tar/cache-service failure must
        # not abort the nightly before tests run — the next cold run
        # rebuilds and retries the save.
        continue-on-error: true
        if: steps.apt-debs.outputs.cache-hit != 'true' && steps.toolchain.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-llvm21-radare2-v1

      # RAPTOR_MAX_SESSION_SECONDS: tier wallclock tripwire (root
      # conftest). Nightly #193 measured 1829s for the expanded slow tier.
      # Allow 45 minutes for tests, with 15 additional minutes in the job
      # timeout for setup and report uploads. Keep the tripwire enabled so
      # further growth remains visible before the job is forcibly cancelled.
      - name: Run slow tests
        id: slow_tests
        env:
          RAPTOR_RANDOMISE_TESTS: ${{ github.run_id }}
          RAPTOR_MAX_SESSION_SECONDS: '2700'
        run: |
          source $VENV_PATH/bin/activate
          # .github test dirs included for their slow-marked
          # whole-repo import-graph classes (excluded from ci-lint's
          # bounded PR job by the default addopts marker filter).
          python -m pytest -m slow core packages engine .github/tests .github/scripts/tests -q --durations=25 \
            --junitxml="$RUNNER_TEMP/slow.xml"

      # Full-collection lane, so --full: a count below the recorded
      # one is stale headroom worth a warning, not a filtered subset.
      - name: Check slow-lane skip count against its recorded budget
        if: ${{ !cancelled() && (steps.slow_tests.outcome == 'success' || steps.slow_tests.outcome == 'failure') }}
        run: |
          python3 .github/scripts/check_skip_budget.py \
            --lane nightly-slow --full \
            --junit-xml "$RUNNER_TEMP/slow.xml"

      - name: Run integration tests (retry once on external outage)
        id: integration_tests
        # Preserve integration coverage after a slow-test or skip-budget
        # failure. Require the slow step to have run so setup failures
        # do not launch tests in an unprepared environment.
        if: ${{ !cancelled() && (steps.slow_tests.outcome == 'success' || steps.slow_tests.outcome == 'failure') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source $VENV_PATH/bin/activate
          rc=0
          python -m pytest -m integration core packages engine --durations=25 \
            --tb=short --junitxml="$RUNNER_TEMP/integration-attempt-1.xml" \
            || rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo ""
          echo "::warning::Integration tests failed (exit $rc) — retrying in 60s"
          echo ""
          sleep 60
          python -m pytest -m integration core packages engine --durations=25 \
            --tb=short --junitxml="$RUNNER_TEMP/integration-attempt-2.xml"

      # Budget over the attempt that produced the green: attempt 2
      # exists only when attempt 1 failed and was retried.
      - name: Check integration skip count against its recorded budget
        if: ${{ !cancelled() && (steps.integration_tests.outcome == 'success' || steps.integration_tests.outcome == 'failure') }}
        run: |
          xml="$RUNNER_TEMP/integration-attempt-2.xml"
          [ -f "$xml" ] || xml="$RUNNER_TEMP/integration-attempt-1.xml"
          python3 .github/scripts/check_skip_budget.py \
            --lane nightly-integration --full \
            --junit-xml "$xml"

      # Backstop for the continue-on-error toolchain install above: the
      # r2 / llvm-cov test families skip-with-reason when their binaries
      # are absent, so a persistently broken install would read as a
      # green nightly with those families never executing. Verify the
      # tools actually landed and fail the run with a named reason if
      # not. Runs AFTER the test steps (and even when they failed) so
      # the toolchain-independent signal is still collected either way.
      # Trade-off both ways: checking earlier would save the ~30 min of
      # tests on a broken mirror day but would also discard the healthy
      # families' signal; checking here keeps the signal and still
      # refuses the silent-skip rot.
      - name: Refuse a toolchain-less binary-analysis nightly
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          missing=""
          command -v r2 >/dev/null 2>&1 || missing="$missing radare2"
          /usr/lib/llvm-21/bin/llvm-cov --version >/dev/null 2>&1 \
            || missing="$missing llvm-21"
          if [ -n "$missing" ]; then
            echo "::error::binary-analysis toolchain missing:${missing} —" \
              "the r2/llvm test families above can only skip, so this" \
              "nightly produced no binary-analysis signal. Check the" \
              "toolchain install step's log."
            exit 1
          fi
          echo "Toolchain present: r2 + llvm-21."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-slow-integration-results
          path: |
            ${{ runner.temp }}/slow.xml
            ${{ runner.temp }}/integration-attempt-*.xml
          retention-days: 14
          if-no-files-found: ignore

  java-log-query:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'semgrep'
    # Separate tool-backed regression: no optional-tool skip and no added
    # time or memory contention in the existing slow/integration job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CodeQL CLI
        id: codeql_cli
        continue-on-error: true  # Cache availability must not gate execution.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
        with:
          path: ${{ runner.temp }}/java-log-codeql
          key: java-log-codeql-${{ runner.os }}-${{ runner.arch }}-2.23.8-v1

      - name: Install CodeQL CLI
        if: steps.codeql_cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/github/codeql-cli-binaries/releases/download/v2.23.8/codeql-linux64.zip \
            --output "$RUNNER_TEMP/codeql-linux64.zip"
          printf '%s  %s\n' \
            e61bc8aa8d86d45acd9d1c36629a12bbfb3365cd07a31666a2ebc91c6a1940b2 \
            "$RUNNER_TEMP/codeql-linux64.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/java-log-codeql"
          unzip -q -o "$RUNNER_TEMP/codeql-linux64.zip" -d "$RUNNER_TEMP/java-log-codeql"

      - name: Save CodeQL CLI
        if: steps.codeql_cli.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
        with:
          path: ${{ runner.temp }}/java-log-codeql
          key: java-log-codeql-${{ runner.os }}-${{ runner.arch }}-2.23.8-v1

      - name: Checkout matching CodeQL Java libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: github/codeql
          ref: 28b6aa8616a393ebb45186e3ba4df004a0f3ef4e  # codeql-cli/v2.23.8
          path: .codeql-java-log-libraries
          sparse-checkout: |
            java/ql/lib
            shared
          persist-credentials: false

      - name: Run Java log-injection query regression
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/java-log-codeql/codeql/codeql"
          "$cli" version
          mkdir -p "$RUNNER_TEMP/java-log-tests"
          cp -R engine/codeql/queries "$RUNNER_TEMP/java-log-tests/queries"
          cp -R engine/codeql/tests/java "$RUNNER_TEMP/java-log-tests/tests"
          "$cli" test run --threads=2 --ram=4096 --format=json \
            --search-path="$GITHUB_WORKSPACE/.codeql-java-log-libraries" \
            --additional-packs="$RUNNER_TEMP/java-log-tests/queries/java:$RUNNER_TEMP/java-log-tests/tests" \
            "$RUNNER_TEMP/java-log-tests/tests/log-injection" \
            > "$RUNNER_TEMP/java-log-tests/results.json"

      - name: Compile production Java log query
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/java-log-codeql/codeql/codeql" query compile --threads=2 --ram=4096 \
            --search-path="$GITHUB_WORKSPACE/.codeql-java-log-libraries" \
            --additional-packs="$RUNNER_TEMP/java-log-tests/queries/java" \
            "$RUNNER_TEMP/java-log-tests/queries/java/LogInjection.ql" \
            2>&1 | tee "$RUNNER_TEMP/java-log-tests/production-compile.log"

      - name: Upload Java query test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-java-log-query-results
          path: |
            ${{ runner.temp }}/java-log-tests/results.json
            ${{ runner.temp }}/java-log-tests/tests/log-injection/*.actual
            ${{ runner.temp }}/java-log-tests/tests/log-injection/*.expected
            ${{ runner.temp }}/java-log-tests/production-compile.log
          retention-days: 14
          if-no-files-found: ignore

  semgrep-regressions:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'semgrep' || inputs.suite == 'scan-and-java-log')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore or rebuild venv
        uses: ./.github/actions/setup-venv
        with:
          cache-key-prefix: venv-scan-regressions
          save-on-rebuild: 'true'

      - name: Install Semgrep
        run: |
          uv tool install semgrep==1.177.0
          semgrep --version

      - name: Run sanitizer regressions
        run: |
          set -euo pipefail
          source "$VENV_PATH/bin/activate"
          # Focus on the header/log changes rather than the broader
          # command/PHP sanitizer matrix. Require both patches on the ref
          # so a missing log regression cannot silently pass selection.
          scan_tests=(
            engine/semgrep/tests/test_header_sanitizer_precision.py
            engine/semgrep/tests/test_log_sanitizer_precision.py
          )
          for scan_test in "${scan_tests[@]}"; do
            if [ ! -f "$scan_test" ]; then
              echo "::error::Missing $scan_test — apply the corresponding sanitizer patch to this ref"
              exit 1
            fi
          done
          printf '%s\n' "${scan_tests[@]}"
          python -m pytest "${scan_tests[@]}" -m 'not corpus and not integration' -q \
            --junitxml="$RUNNER_TEMP/scan-regressions.xml"
          python - "$RUNNER_TEMP/scan-regressions.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          if not cases:
              sys.exit("No sanitizer regression tests executed")
          skipped = [case.get("name") for case in cases if case.find("skipped") is not None]
          if skipped:
              sys.exit(f"Sanitizer regression tests skipped: {skipped}")
          print(f"Verified {len(cases)} sanitizer regressions executed without skips")
          PY

      - name: Upload sanitizer test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: focused-semgrep-regression-results
          path: ${{ runner.temp }}/scan-regressions.xml
          retention-days: 14
          if-no-files-found: ignore
