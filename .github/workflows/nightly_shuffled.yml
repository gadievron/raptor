name: Nightly (shuffled fast)

# Re-runs the default-tier tests multiple times with distinct random
# seeds to flush out order-dependent failures.  Each seed gets its own
# runner via the matrix so the iterations run in parallel — wall-clock
# is one iteration, not three.

on:
  schedule:
    # 07:15 UTC — 15 minutes after the slow+integration nightly so the
    # two don't compete for the same runner pool at the same instant.
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  VENV_PATH: .venv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shuffled-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Create venv and install deps
        run: |
          uv venv $VENV_PATH
          source $VENV_PATH/bin/activate
          uv pip install -r requirements-dev.txt
          # Grammar wheels: same rationale as the slow nightly — the
          # shuffled fast tier is where grammar-dependent suites run
          # at volume, and without the wheels they all skip.
          uv pip install -r requirements-grammars.txt

      - name: Shuffled default-tier tests (seed ${{ matrix.iteration }})
        run: |
          source $VENV_PATH/bin/activate
          seed="${{ github.run_id }}-${{ matrix.iteration }}"
          echo "seed=${seed}"
          RAPTOR_RANDOMISE_TESTS="$seed" \
            python -m pytest core packages \
            -q --durations=25 --tb=short \
            --junitxml="$RUNNER_TEMP/fast-iter-${{ matrix.iteration }}.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: nightly-shuffled-fast-iter-${{ matrix.iteration }}
          path: ${{ runner.temp }}/fast-iter-${{ matrix.iteration }}.xml
          retention-days: 14
          if-no-files-found: ignore
