name: Nightly (shuffled fast)

# Re-runs the default-tier tests multiple times with distinct random
# seeds to flush out order-dependent failures.  Each seed gets its own
# runner via the matrix so the iterations run in parallel — wall-clock
# is one iteration, not three.

on:
  schedule:
    # 07:15 UTC — 15 minutes after the slow+integration nightly so the
    # two don't compete for the same runner pool at the same instant.
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  VENV_PATH: .venv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shuffled-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable unprivileged user namespaces
        # Ubuntu 24.04 runners block unprivileged user namespaces via
        # AppArmor by default; the sandbox's mount-ns backend needs them
        # (plus newuidmap/newgidmap from uidmap). Without this, the
        # untrusted-run fresh-procfs contract correctly refuses the
        # host-procfs-visible fallback and every untrusted-target test
        # fails at setup.
        run: |
          sudo apt-get install -y --no-install-recommends uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create venv and install deps
        run: uv sync --locked

      # Parallelism: ``-n auto --dist loadfile`` (4 workers on
      # ubuntu-latest). The tier's purpose is ORDER-DEPENDENCE
      # detection, so the trade is stated here, not buried:
      #   * loadfile keeps every FILE on one worker, so the seeded
      #     shuffle's scope grouping (root conftest) still bounds each
      #     module/class fixture to one setup (loadscope was measured
      #     re-running module fixtures once per worker that hosted one
      #     of the module's classes), and intra-file order stays fully
      #     randomised per the seed;
      #   * file ORDER remains seeded-random, but files split across N
      #     workers — a given cross-file pair co-locates on a worker
      #     with ~1/N probability per iteration. Three iterations per
      #     night with distinct seeds (and fresh seeds nightly) keep
      #     accumulating cross-file coverage; the single-process shape
      #     stays one flag away (drop -n) when chasing a specific
      #     order bug;
      #   * the egress-leak guard is xdist-ENFORCED (workers report
      #     through the controller's marker dir — root conftest), so
      #     parallelism costs no guard power.
      #
      # Tier wallclock tripwire (root conftest): flags the session —
      # with a named summary instead of an opaque runner kill — when
      # an iteration exceeds the budget. Baseline at the time this was
      # set: ~19 min single-process locally / ~21.5 min on
      # ubuntu-latest (42k tests); measured 4.3x on 4 local workers
      # under loadfile (19:07 → 4:29 — the sleep-bound fat tail
      # parallelises cleanly), so the expected CI iteration is
      # ~6-9 min. The 1800s budget carries ~3x headroom over that —
      # re-baseline after the first few nightly runs. If it fires
      # without a starved runner, the tier has structurally drifted:
      # re-measure, fix the drift or consciously raise the budget with
      # the new baseline.
      - name: Shuffled default-tier tests (seed ${{ matrix.iteration }})
        run: |
          source $VENV_PATH/bin/activate
          seed="${{ github.run_id }}-${{ matrix.iteration }}"
          echo "seed=${seed}"
          RAPTOR_RANDOMISE_TESTS="$seed" \
          RAPTOR_MAX_SESSION_SECONDS=1800 \
            python -m pytest core packages \
            -n auto --dist loadfile \
            -q --durations=25 --tb=short \
            --junitxml="$RUNNER_TEMP/fast-iter-${{ matrix.iteration }}.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: nightly-shuffled-fast-iter-${{ matrix.iteration }}
          path: ${{ runner.temp }}/fast-iter-${{ matrix.iteration }}.xml
          retention-days: 14
          if-no-files-found: ignore
