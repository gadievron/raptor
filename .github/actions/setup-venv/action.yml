name: Restore or rebuild the project venv
description: >
  Restore the uv-built project venv from the actions cache with
  retries for reported restore failures and a locked rebuild when
  no cache is usable, then re-point the python symlinks at the current
  setup-python interpreter. Requires the calling job to have run
  actions/setup-python and to expose VENV_PATH in
  its environment (both are workflow-level env in every caller).

  Exact keys include the host OS/image, architecture, interpreter build/ABI,
  workspace location, project/lock/config files, install method and extras.
  Old-lock prefix hits are never executable environments. Reported restore
  failures retry the same exact key after backoff; misses rebuild locked deps.

inputs:
  cache-key-prefix:
    description: >
      First segment of the cache key. The default matches the key the
      deps job saves; flavoured venvs (e.g. with extra dependency
      groups) use their own labels. The exact identity also includes
      the install method and extras; prefix restores are never used.
    required: false
    default: 'venv'
  install-method:
    description: >
      export (default) preserves the existing locked export/install recipe;
      sync uses uv sync --locked in the fresh active venv, retaining lockfile
      artifact validation for callers migrating from uv sync.
    required: false
    default: 'export'
  uv-export-extra-args:
    description: >
      Extra arguments appended to the selected export or sync command
      on the rebuild path (e.g. ``--extra grammars``). Must be valid for
      the selected install method. Space-separated,
      word-split unquoted; empty adds nothing.
    required: false
    default: ''
  requirements-file:
    description: >
      Optional checkout-relative, self-contained requirements file of exact
      name==version pins. Its path and bytes enter the cache identity. Install
      these requirements after the locked project dependencies and before
      saving the complete environment. Includes and index options are refused.
    required: false
    default: ''
  save-on-rebuild:
    description: >
      Save the venv back to the cache after a rebuild ("true"/"false").
      Callers whose key no other job saves (flavoured venvs) set this
      so the rebuild cost is paid once per uv.lock change, not nightly.
      Every profile uses exact-key restoration and rebuilds on a miss.
    required: false
    default: 'false'

outputs:
  cache-key:
    description: Exact identity used by this restore/build
    value: ${{ steps.venv-key.outputs.key }}
  platform-key:
    description: Host image and architecture identity for native tool caches
    value: ${{ steps.venv-key.outputs.platform_key }}
  week:
    description: UTC weekly refresh bucket for mutable native package caches
    value: ${{ steps.venv-key.outputs.week }}

runs:
  using: composite
  steps:
    - name: Compute exact venv identity
      id: venv-key
      shell: bash
      env:
        VENV_CACHE_PREFIX: ${{ inputs.cache-key-prefix }}
        VENV_CACHE_EXPORT_ARGS: ${{ inputs.uv-export-extra-args }}
        VENV_CACHE_INSTALL_METHOD: ${{ inputs.install-method }}
        VENV_CACHE_REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: python3 .github/scripts/ci_cache_key.py

    - name: Stagger cache restore (avoid 429 thundering herd)
      shell: bash
      run: sleep $((RANDOM % 8))

    - name: Restore venv from cache (attempt 1, exact key)
      id: cache-1
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
      with:
        path: ${{ env.VENV_PATH }}
        key: ${{ steps.venv-key.outputs.key }}
        fail-on-cache-miss: false

    - name: Backoff before retry
      if: steps.cache-1.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Restore venv from cache (attempt 2, exact key)
      id: cache-2
      if: steps.cache-1.outcome == 'failure'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
      with:
        path: ${{ env.VENV_PATH }}
        key: ${{ steps.venv-key.outputs.key }}

    - name: Install uv (rebuild fallback when no cache was restored)
      if: >-
        ${{ !((steps.cache-1.outcome == 'success' && steps.cache-1.outputs.cache-hit == 'true') ||
              (steps.cache-2.outcome == 'success' && steps.cache-2.outputs.cache-hit == 'true')) }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        # An outer setup-uv owns an exported UV_CACHE_DIR. Do not restore/save
        # that directory a second time under another action instance's state.
        enable-cache: ${{ env.UV_CACHE_DIR == '' }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          uv.toml
          ${{ inputs.requirements-file }}

    - name: Rebuild venv (rebuild fallback when no cache was restored)
      id: rebuild
      if: >-
        ${{ !((steps.cache-1.outcome == 'success' && steps.cache-1.outputs.cache-hit == 'true') ||
              (steps.cache-2.outcome == 'success' && steps.cache-2.outputs.cache-hit == 'true')) }}
      shell: bash
      env:
        UV_EXPORT_EXTRA_ARGS: ${{ inputs.uv-export-extra-args }}
        VENV_CACHE_INSTALL_METHOD: ${{ inputs.install-method }}
        VENV_CACHE_REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        uv venv --clear --python "$(command -v python3)" "$VENV_PATH"
        source "$VENV_PATH/bin/activate"
        case "$VENV_CACHE_INSTALL_METHOD" in
          export) uv export --locked --no-hashes $UV_EXPORT_EXTRA_ARGS | uv pip install -r - ;;
          sync) uv sync --locked --active $UV_EXPORT_EXTRA_ARGS ;;
          *) echo "Invalid venv install method" >&2; exit 2 ;;
        esac
        if [[ -n "${VENV_CACHE_REQUIREMENTS_FILE:-}" ]]; then
          uv pip install --python "$VENV_PATH/bin/python" -r "$VENV_CACHE_REQUIREMENTS_FILE"
        fi

    - name: Save rebuilt venv to cache
      # continue-on-error: the cache is an optimisation — a failed save
      # (tar exit 2 on disk pressure, transient cache-service errors)
      # means the next run rebuilds again, not that this run's tests
      # should be skipped.
      continue-on-error: true
      if: >-
        inputs.save-on-rebuild == 'true' &&
        steps.rebuild.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # was v6.1.0
      with:
        path: ${{ env.VENV_PATH }}
        key: ${{ steps.venv-key.outputs.key }}

    - name: Restore venv permissions and fix symlinks
      shell: bash
      run: |
        # Re-point python symlinks at the current setup-python binary
        # so shebangs in pip-installed scripts (pytest, etc.) resolve.
        REAL_PYTHON=$(python3 -c "import sys; print(sys.executable)")
        ln -sf "$REAL_PYTHON" "$VENV_PATH/bin/python"
        ln -sf "$REAL_PYTHON" "$VENV_PATH/bin/python3"
        PYMINOR=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
        ln -sf "$REAL_PYTHON" "$VENV_PATH/bin/python${PYMINOR}"
        find "$VENV_PATH/bin" -maxdepth 1 -type f -exec chmod +x {} +
