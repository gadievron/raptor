# CodeQL configuration for GitHub code scanning.
#
# Loaded by the workflow at .github/workflows/codeql.yml via its
# `config-file:` argument. (GitHub's default *auto* setup does not
# honour in-repo configs — that's why we ship an advanced workflow.)
#
# Test fixtures and intentionally-vulnerable testbeds exist to validate
# RAPTOR's own dataflow validation pipeline and exploit-feasibility
# analyses. Scanning them produces alerts that look real but are
# by-design honeypots, drowning out signal from actual code.
name: RAPTOR CodeQL config

paths-ignore:
  # Test code includes synthetic URLs, planted secrets, and deliberately
  # vulnerable fixtures. Apply this consistently, including .github/tests,
  # instead of adding per-suite exceptions after each fixture alert.
  # Dedicated test/query jobs still exercise these files.
  - "**/tests/**"
  - "**/test/**"
  - "**/test_fixtures/**"
  # sandbox helpers_test.c sets directory permissions then calls
  # validate_exec_target — inherently TOCTOU by test design.
  # The write_file_mode TOCTOU is fixed (fchmod on fd), but the
  # chmod→validate pairs are the test exercising the security check.
  - "core/sandbox/helpers/*_test*"
  # Git worktree mirrors — duplicates of in-tree source that would cause
  # double-counted alerts if scanned.
  - ".claude/worktrees/**"
  # The web scanner's raw-probe TLS shim disables certificate and
  # hostname validation and floors the version at TLS 1.0 BY DESIGN —
  # it builds attack traffic for authorized scan targets (self-signed
  # staging included), not a client channel with anything to protect.
  # CodeQL correctly flags that construction in client code; here the
  # insecurity is the feature. The shim is quarantined to this one
  # module (with a never-use-for-real-egress warning) precisely so the
  # checks consuming it stay fully scanned.
  - "packages/web/_probe_tls.py"
