[project]
name = "raptor"
version = "3.1.0"
description = "Autonomous offensive/defensive security research framework"
readme = "README.md"
# 3.12 floor, probed empirically: the sandbox hard-requires os.unshare
# (3.12+) and runtime modules use typing.Self (3.11+) — the suite fails
# at import/setup on 3.10 and 3.11 and passes in full on 3.12.
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
    { name = "Gadi Evron" },
    { name = "Daniel Cuthbert" },
    { name = "Thomas Dullien" },
    { name = "Michael Bargury" },
    { name = "John Cartwright" },
]

dependencies = [
    "requests==2.34.2",
    "urllib3==2.8.0",
    "pydantic==2.13.4",
    "typer==0.25.1",
    "instructor==1.15.4",
    "openai==2.30.0",
    "tabulate==0.10.0",
    "pyyaml==6.0.3",
    "defusedxml==0.7.1",
    "packaging==25.0",
    "pyelftools==0.33",
]

[project.optional-dependencies]
# LLM providers — per-provider for targeted installs
anthropic = ["anthropic==0.103.1"]
google = ["google-genai==2.4.0"]
bedrock = ["botocore==1.43.16"]
llm = [
    "anthropic==0.103.1",
    "google-genai==2.4.0",
    "botocore==1.43.16",
]

# Feature groups
web = [
    "beautifulsoup4==4.15.0",
    "playwright==1.60.0",
]
smt = ["z3-solver>=4.13.0.0,<4.15.5.0"]
binary = ["angr==9.3.3; python_version >= '3.12'"]
sage = [
    "sage-agent-sdk==11.17.11",
    "httpx==0.28.1",
]
grammars = [
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-lua==0.5.0",
    "tree-sitter-php==0.24.1",
    "tree-sitter-python==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-scala==0.26.0",
    "tree-sitter-swift==0.7.3",
    "tree-sitter-typescript==0.23.2",
]

# ZKPoX Tier 2/3 (packages/zkpox/{disclosure,anchor,envelope,prove}).
# Optional at runtime — kept out of the base dependency set to preserve
# the dependency-free Tier 0/1 import contract (packages/zkpox/__init__.py
# guards these behind try/except ImportError) — but required to run the
# disclosure / anchor / envelope / prove tests.
zkpox = [
    "cryptography==50.0.1",
    "cbor2==6.0.1",
]

# Smaller optional deps
h2 = ["h2==4.4.1"]
cvss = ["cvss==3.6"]
orjson = ["orjson==3.11.9"]
r2pipe = ["r2pipe==1.9.8"]
pyghidra = ["pyghidra==3.1.0"]
frida = ["frida==16.7.19"]
jsonschema = ["jsonschema==4.23.0"]

[project.urls]
Homepage = "https://github.com/gadievron/raptor"
Repository = "https://github.com/gadievron/raptor"
Issues = "https://github.com/gadievron/raptor/issues"

[dependency-groups]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-split==0.11.0",
    "gcovr==8.6",
    "beautifulsoup4==4.15.0",
    "z3-solver>=4.13.0.0,<4.15.5.0",
    # ZKPoX Tier 2/3 test deps — so packages/zkpox/{disclosure,anchor,
    # envelope,prove} tests run in CI instead of importorskip-ing.
    "cryptography==50.0.1",
    "cbor2==6.0.1",
]
lint = [
    "ruff==0.15.12",
    "mypy==2.4.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
package = false
override-dependencies = [
    "z3-solver==4.15.4.0",
]

[tool.mypy]
exclude = ["tests/", "static-analysis/"]
warn_return_any = false
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = [
    "angr.*",
    "anthropic.*",
    "atheris",
    "botocore.*",
    "claripy",
    "core.analysis.cfg_builder_generic",
    "cve_diff.*",
    "cve_env.*",
    "defusedxml.*",
    "ghidra.*",
    "google",
    "google.*",
    "instructor.*",
    "jsonschema.*",
    "orjson",
    "playwright.*",
    "pwn",
    "pwnlib.*",
    "pyghidra.*",
    "r2pipe",
    "sage_sdk.*",
    "tabulate",
    "tomli",
    "tree_sitter",
    "tree_sitter_c",
    "tree_sitter_cpp",
    "tree_sitter_go",
    "tree_sitter_java",
    "tree_sitter_javascript",
    "wcwidth",
    "yaml",
    "z3",
    "zstandard",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep this in one place. The CI lint workflow reads Ruff's normal config
# discovery path instead of repeating the rule list in shell flags.
select = [
    "F401", # unused imports
    "F811", # redefinition of unused names
    "F821", # undefined names
    "F841", # unused local variables
]
